packages:
  - "apps/*"
  - "packages/*"

# Dependencies whose install/build scripts are allowed to run. pnpm 11's
# native key (the pnpm 10 `onlyBuiltDependencies` array is no longer honored;
# leaving these off makes pnpm 11 fail the install with ERR_PNPM_IGNORED_BUILDS).
allowBuilds:
  "@firebase/util": true
  "@nestjs/core": true
  "@scarf/scarf": true
  "bcrypt": true
  "esbuild": true
  "msgpackr-extract": true
  "protobufjs": true
  "sharp": true
  "unrs-resolver": true
  "workerd": true

overrides:
  "@maplibre/maplibre-gl-style-spec": "24.8.3"
