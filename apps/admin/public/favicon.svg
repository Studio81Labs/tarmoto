<?xml version="1.0" encoding="UTF-8"?>
<!--
  Tarmoto admin console favicon — the brand mark on accent
  (docs/design/brand/logo-mark-on-accent.svg): coral-orange rounded square
  with the road mark in ink-warm. Same treatment as the console sidebar's
  brand block, and deliberately the inverse of the marketing site's favicon
  (dark square, orange mark) so an admin tab is distinguishable at a glance.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Tarmoto Admin Console">
  <title>Tarmoto Admin Console</title>
  <rect x="0" y="0" width="120" height="120" rx="24" fill="#FF6A1A"/>
  <g transform="translate(10 10)">
    <rect x="18" y="20" width="64" height="12" rx="4" fill="#1A120D"/>
    <rect x="40" y="20" width="20" height="42" rx="4" fill="#1A120D"/>
    <path d="M 16 80 L 30 80 L 38 70 L 46 86 L 54 68 L 62 82 L 70 76 L 84 76"
          stroke="#1A120D" stroke-width="5" stroke-linecap="round"
          stroke-linejoin="round" fill="none"/>
  </g>
</svg>
