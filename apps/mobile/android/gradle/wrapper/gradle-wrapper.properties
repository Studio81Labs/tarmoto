# Pinned to the Gradle line React Native 0.85's gradle-plugin (Kotlin 2.1)
# can read. Gradle 9.7 bundles Kotlin 2.3/2.4-metadata jars and breaks
# :gradle-plugin:settings-plugin:compileKotlin on every build (#1249) — and
# only the main-push preview jobs would show it. Move this only with a
# deliberate React Native upgrade; Renovate's gradle-wrapper manager is
# disabled for exactly this reason (renovate.json).
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
