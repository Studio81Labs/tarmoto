                type: array
                items:
                  $ref: '#/components/schemas/FeedRideDto'
      security: *ref_12
      summary: Get ride feed from followed riders
      tags: *ref_13
info:
  title: Tarmoto API
  description: Know the road before you ride it
  version: '1.0'
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    RegisterDto:
      type: object
      properties:
        email:
          type: string
          example: rider@example.com
        password:
          type: string
          example: securePassword123
          minLength: 8
          maxLength: 72
        display_name:
          type: string
          example: Martin_CZ
          maxLength: 100
      required:
        - email
        - password
        - display_name
    UserResponse:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        display_name:
          type: string
        phone:
          type: string
          nullable: true
        created_at:
          type: string
      required:
        - id
        - email
        - display_name
        - created_at
    AuthResponseDto:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: number
          description: Seconds until access token expires
        user:
          $ref: '#/components/schemas/UserResponse'
      required:
        - access_token
        - refresh_token
        - expires_in
        - user
    LoginDto:
      type: object
      properties:
        email:
          type: string
          example: rider@example.com
        password:
          type: string
      required:
        - email
        - password
    RefreshTokenDto:
      type: object
      properties:
        refresh_token:
          type: string
      required:
        - refresh_token
    LatLngResponse:
      type: object
      properties:
        lat:
          type: number
        lng:
          type: number
      required:
        - lat
        - lng
    UserResponseDto:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        display_name:
          type: string
        phone:
          type: string
          nullable: true
        home_location:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/LatLngResponse'
        work_location:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/LatLngResponse'
        preferences:
          type: object
        created_at:
          type: string
      required:
        - id
        - email
        - display_name
        - phone
        - home_location
        - work_location
        - preferences
        - created_at
    LatLngDto:
      type: object
      properties:
        lat:
          type: number
        lng:
          type: number
      required:
        - lat
        - lng
    UserPreferencesDto:
      type: object
      properties:
        units:
          type: string
        daily_km:
          type: number
        min_quality:
          type: number
        road_types:
          type: array
          items:
            type: string
        record_gps:
          type: boolean
        crash_detection:
          type: boolean
    UpdateProfileDto:
      type: object
      properties:
        display_name:
          type: string
        phone:
          type: string
        home_location:
          $ref: '#/components/schemas/LatLngDto'
        work_location:
          $ref: '#/components/schemas/LatLngDto'
        preferences:
          $ref: '#/components/schemas/UserPreferencesDto'
    ContactResponseDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        phone:
          type: string
        is_emergency:
          type: boolean
        created_at:
          type: string
      required:
        - id
        - name
        - phone
        - is_emergency
        - created_at
    CreateContactDto:
      type: object
      properties:
        name:
          type: string
          example: Jane Doe
        phone:
          type: string
          example: '+420123456789'
        is_emergency:
          type: boolean
          default: true
      required:
        - name
        - phone
    HazardResponseDto:
      type: object
      properties:
        id:
          type: string
        lat:
          type: number
        lng:
          type: number
        hazard_type:
          type: string
        severity:
          type: string
        note:
          type: string
          nullable: true
        confirmations:
          type: number
        reporter:
          type: string
          nullable: true
        road_name:
          type: string
          nullable: true
        created_at:
          type: string
        expires_at:
          type: string
      required:
        - id
        - lat
        - lng
        - hazard_type
        - severity
        - note
        - confirmations
        - reporter
        - road_name
        - created_at
        - expires_at
    CreateHazardDto:
      type: object
      properties:
        lat:
          type: number
          example: 49.1
        lng:
          type: number
          example: 16.75
        hazard_type:
          type: string
          enum:
            - pothole
            - gravel
            - oil_spill
            - roadworks
            - animals
            - police
            - flooding
            - ice
            - other
          example: pothole
        severity:
          type: string
          enum:
            - low
            - medium
            - high
          default: medium
        note:
          type: string
          maxLength: 500
      required:
        - lat
        - lng
        - hazard_type
    LatLng:
      type: object
      properties:
        lat:
          type: number
        lng:
          type: number
      required:
        - lat
        - lng
    RouteHazardsDto:
      type: object
      properties:
        route:
          minItems: 2
          type: array
          items:
            $ref: '#/components/schemas/LatLng'
        buffer_m:
          type: number
          default: 200
      required:
        - route
    SensorReadingDto:
      type: object
      properties:
        t:
          type: number
          description: Unix timestamp milliseconds
        ax:
          type: number
          description: Accelerometer X (m/s²)
        ay:
          type: number
          description: Accelerometer Y (m/s²)
        az:
          type: number
          description: Accelerometer Z (m/s²)
        lat:
          type: number
        lng:
          type: number
        speed:
          type: number
          description: Speed in m/s
      required:
        - t
        - ax
        - ay
        - az
    UploadSensorDataDto:
      type: object
      properties:
        ride_id:
          type: string
          format: uuid
        device_model:
          type: string
          example: iPhone 15 Pro
        readings:
          maxItems: 5000
          type: array
          items:
            $ref: '#/components/schemas/SensorReadingDto'
      required:
        - ride_id
        - readings
    UploadResponseDto:
      type: object
      properties:
        accepted:
          type: number
          description: Number of readings accepted
        segments_updated:
          type: number
          description: Road segments that got new quality data
      required:
        - accepted
        - segments_updated
    RoadSegmentDto:
      type: object
      properties:
        id:
          type: string
        road_name:
          type: string
          nullable: true
        road_number:
          type: string
          nullable: true
        quality_score:
          type: number
          nullable: true
          description: 1-5 scale
        curviness_score:
          type: number
          description: 0-5 scale
        surface_type:
          type: string
        length_m:
          type: number
        confidence:
          type: number
          description: 0-100, based on number of readings
        reading_count:
          type: number
        last_updated:
          type: string
        distance_m:
          type: number
          description: Distance from query point in meters
      required:
        - id
        - road_name
        - road_number
        - quality_score
        - curviness_score
        - surface_type
        - length_m
        - confidence
        - reading_count
        - last_updated
    FunZoneDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          nullable: true
        composite_score:
          type: number
        road_count:
          type: number
        total_curve_km:
          type: number
          nullable: true
        avg_quality:
          type: number
          nullable: true
        best_season:
          type: string
          nullable: true
        boundary:
          type: array
          items:
            type: object
      required:
        - id
        - name
        - composite_score
        - road_count
        - total_curve_km
        - avg_quality
        - best_season
        - boundary
    QualityBreakdownDto:
      type: object
      properties:
        excellent:
          type: number
        good:
          type: number
        fair:
          type: number
        poor:
          type: number
        very_poor:
          type: number
      required:
        - excellent
        - good
        - fair
        - poor
        - very_poor
    RoadSegmentDetailDto:
      type: object
      properties:
        id:
          type: string
        road_name:
          type: string
          nullable: true
        road_number:
          type: string
          nullable: true
        quality_score:
          type: number
          nullable: true
          description: 1-5 scale
        curviness_score:
          type: number
          description: 0-5 scale
        surface_type:
          type: string
        length_m:
          type: number
        confidence:
          type: number
          description: 0-100, based on number of readings
        reading_count:
          type: number
        last_updated:
          type: string
        distance_m:
          type: number
          description: Distance from query point in meters
        geometry:
          type: array
          items:
            type: object
        elevation_min:
          type: number
          nullable: true
        elevation_max:
          type: number
          nullable: true
        quality_breakdown:
          $ref: '#/components/schemas/QualityBreakdownDto'
        active_hazards:
          type: number
        review_count:
          type: number
        avg_review_rating:
          type: number
          nullable: true
        riders_per_month:
          type: number
      required:
        - id
        - road_name
        - road_number
        - quality_score
        - curviness_score
        - surface_type
        - length_m
        - confidence
        - reading_count
        - last_updated
        - geometry
        - elevation_min
        - elevation_max
        - quality_breakdown
        - active_hazards
        - review_count
        - avg_review_rating
        - riders_per_month
    ToggleShareDto:
