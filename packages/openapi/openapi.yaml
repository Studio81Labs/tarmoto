            - clear
            - cloudy
            - rain
            - storm
            - snow
            - fog
            - ice
        wind_kmh:
          type: number
        precipitation_chance:
          type: number
        road_condition:
          type: string
          enum: &ref_15
            - dry
            - wet
            - icy
            - unknown
        description:
