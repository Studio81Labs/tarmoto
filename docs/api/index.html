<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tarmoto API — Documentation</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.17.14/swagger-ui.min.css">
<style>
body { margin: 0; background: #1a1a2e; }
.swagger-ui .topbar { display: none; }
.swagger-ui { max-width: 1200px; margin: 0 auto; }
.header { background: #0C1018; padding: 16px 24px; border-bottom: 1px solid rgba(255,255,255,.06); display: flex; align-items: center; gap: 12px; }
.header svg { width: 28px; height: 28px; }
.header h1 { font-family: 'Segoe UI', sans-serif; font-size: 16px; font-weight: 800; color: #0ED3CF; letter-spacing: -0.02em; margin: 0; }
.header span { font-size: 11px; color: #4A5568; }
</style>
</head>
<body>
<div class="header">
<svg viewBox="0 0 100 100" fill="none"><rect x="18" y="20" width="64" height="12" rx="4" fill="#0ED3CF"/><rect x="40" y="20" width="20" height="42" rx="4" fill="#0ED3CF"/><path d="M 16 80 L 30 80 L 38 70 L 46 86 L 54 68 L 62 82 L 70 76 L 84 76" stroke="#0ED3CF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
<div><h1>TARMOTO API</h1><span>v1.0.0 · OpenAPI 3.0</span></div>
</div>
<div id="swagger-ui"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.17.14/swagger-ui-bundle.min.js"></script>
<script>
SwaggerUIBundle({
  url: "openapi.yaml",
  dom_id: '#swagger-ui',
  deepLinking: true,
  presets: [SwaggerUIBundle.presets.apis],
  layout: "BaseLayout",
  defaultModelsExpandDepth: 1,
  docExpansion: "list",
  tryItOutEnabled: false,
});
</script>
</body>
</html>
