<script type="text/babel" data-src="map.jsx">
// Stylized Alps map — hand-drawn SVG. Non-real geography, but map-feeling.
// The "road" is a single path shared across layouts; other elements (quality, hazards,
// topo, waypoints) animate along it based on the rider's progress (0..1 along the path).

// Master road path — drawn once, referenced everywhere
const ROAD_D = "M -40 620 C 60 600, 130 560, 180 520 S 280 440, 340 460 S 440 540, 490 510 S 560 400, 620 380 S 740 400, 790 350 S 840 220, 900 200 S 1020 240, 1080 180";

// Quality-tier color mapping (green → red, muted warm)
const QUALITY_COLORS = {
  5: '#6FD38A', // excellent
  4: '#C7D36A', // good
  3: '#E8D66A', // fair
  2: '#F0A03C', // poor
  1: '#E05A3C', // very poor
};

// Road quality segments — distance along path in %, quality 1-5
const ROAD_SEGMENTS = [
  { start: 0,   end: 15,  q: 5 },
  { start: 15,  end: 28,  q: 4 },
  { start: 28,  end: 38,  q: 5 },
  { start: 38,  end: 48,  q: 3 },
  { start: 48,  end: 58,  q: 2 }, // poor section — this is where the hazard is
  { start: 58,  end: 68,  q: 4 },
  { start: 68,  end: 82,  q: 5 },
  { start: 82,  end: 100, q: 4 },
];

// Hazards along the road (percentage along path)
const HAZARDS = [
  { at: 54, type: 'pothole', label: 'Pothole', severity: 'high' },
  { at: 72, type: 'gravel',  label: 'Gravel',  severity: 'med'  },
  { at: 88, type: 'wet',     label: 'Wet road', severity: 'low' },
];

// Waypoints / POIs
const WAYPOINTS = [
  { at: 8,   name: 'Innsbruck',       sub: 'Start',    kind: 'start' },
  { at: 42,  name: 'Brenner Pass',    sub: '1,370 m',  kind: 'pass'  },
  { at: 65,  name: 'Passo dello Stelvio', sub: '2,758 m', kind: 'pass' },
  { at: 95,  name: 'Bormio',          sub: 'Finish',   kind: 'end'   },
];

// Build a sampled polyline from the SVG path so we can locate points on it
function samplePath(d, samples = 200) {
  if (typeof document === 'undefined') return [];
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  path.setAttribute('d', d);
  svg.appendChild(path);
  const total = path.getTotalLength();
  const pts = [];
  for (let i = 0; i <= samples; i++) {
    const p = path.getPointAtLength((i / samples) * total);
    pts.push({ x: p.x, y: p.y, t: i / samples });
  }
  return pts;
}

// Memoize one sampling
let _cachedPts = null;
function getPathPoints() {
  if (!_cachedPts) _cachedPts = samplePath(ROAD_D, 300);
  return _cachedPts;
}

function pointAt(pct) {
  const pts = getPathPoints();
  if (!pts.length) return { x: 0, y: 0 };
  const i = Math.min(pts.length - 1, Math.max(0, Math.floor((pct / 100) * pts.length)));
  return pts[i];
}

// Build the per-segment overlay paths (colored strokes over the master road)
function SegmentPath({ start, end, q, mapStyle }) {
  if (mapStyle === 'topo') return null; // topo hides quality
  const pts = getPathPoints();
  if (!pts.length) return null;
  const i0 = Math.floor((start / 100) * pts.length);
  const i1 = Math.ceil((end / 100) * pts.length);
  const slice = pts.slice(i0, i1 + 1);
  if (slice.length < 2) return null;
  const d = 'M ' + slice.map(p => `${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' L ');
  const color = QUALITY_COLORS[q];
  return (
    <path d={d} stroke={color} strokeWidth={mapStyle === 'hybrid' ? 7 : 9} strokeLinecap="round" fill="none"
      style={{ filter: mapStyle === 'heatmap' ? `drop-shadow(0 0 6px ${color}aa)` : 'none' }} />
  );
}

// Topographic contour lines for background texture
function TopoContours({ dark }) {
  const stroke = dark ? 'rgba(255,255,255,0.06)' : 'rgba(14,14,16,0.08)';
  const paths = [
    "M -20 200 C 80 220, 180 240, 280 210 S 460 160, 560 190 S 760 240, 880 210 S 1020 170, 1100 200",
    "M -20 260 C 80 280, 200 300, 300 270 S 480 220, 580 250 S 780 300, 900 270 S 1040 230, 1100 260",
    "M -20 340 C 100 360, 220 380, 320 340 S 500 290, 600 320 S 800 370, 920 340 S 1060 300, 1100 330",
    "M -20 420 C 120 440, 240 460, 340 420 S 520 370, 620 400 S 820 450, 940 420 S 1080 380, 1100 410",
    "M -20 500 C 140 520, 260 540, 360 500 S 540 450, 640 480 S 840 530, 960 500 S 1100 460, 1120 490",
    "M -20 580 C 160 600, 280 620, 380 580 S 560 530, 660 560 S 860 610, 980 580 S 1120 540, 1140 570",
    "M -20 660 C 180 680, 300 700, 400 660 S 580 610, 680 640 S 880 690, 1000 660 S 1140 620, 1160 650",
  ];
  return (
    <g opacity="0.9">
      {paths.map((d, i) => (
        <path key={i} d={d} stroke={stroke} strokeWidth={0.8 + (i % 3) * 0.4} fill="none" />
      ))}
    </g>
  );
}

// Mountain ranges
function Mountains({ dark }) {
  const fill = dark ? 'rgba(255,255,255,0.03)' : 'rgba(14,14,16,0.06)';
  const stroke = dark ? 'rgba(255,255,255,0.1)' : 'rgba(14,14,16,0.15)';
  return (
    <g>
      <path d="M 80 330 L 170 210 L 240 280 L 310 190 L 380 260 L 450 220 L 500 280 L 500 360 L 80 360 Z"
        fill={fill} stroke={stroke} strokeWidth="0.6" />
      <path d="M 560 290 L 640 180 L 710 240 L 790 150 L 870 220 L 940 170 L 1020 230 L 1080 180 L 1080 320 L 560 320 Z"
        fill={fill} stroke={stroke} strokeWidth="0.6" />
    </g>
  );
}

// Little helpers for waypoint markers
function WaypointMarker({ wp, accent, dark, mapStyle }) {
  const pos = pointAt(wp.at);
  const isStartEnd = wp.kind === 'start' || wp.kind === 'end';
  const c = isStartEnd ? accent : (dark ? '#F5EFE6' : '#0E0E10');
  return (
    <g transform={`translate(${pos.x} ${pos.y})`}>
      {isStartEnd ? (
        <>
          <circle r="14" fill={c} />
          <circle r="6" fill={dark ? '#0E0E10' : '#F5EFE6'} />
        </>
      ) : (
        <>
          {/* pass summit marker — triangle */}
          <polygon points="-10,8 10,8 0,-10" fill={dark ? '#1A1A1E' : '#F5EFE6'}
            stroke={c} strokeWidth="2" strokeLinejoin="round" />
        </>
      )}
    </g>
  );
}

// Hazard marker — pulses
function HazardMarker({ h, accent }) {
  const pos = pointAt(h.at);
  return (
    <g transform={`translate(${pos.x} ${pos.y})`}>
      <circle r="18" fill={accent} opacity="0.2">
        <animate attributeName="r" values="10;22;10" dur="1.8s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.5;0;0.5" dur="1.8s" repeatCount="indefinite" />
      </circle>
      <circle r="10" fill={accent} />
      <text y="3.5" textAnchor="middle" fontSize="12" fontWeight="800" fill="#0E0E10"
        fontFamily="'Space Grotesk', system-ui">!</text>
    </g>
  );
}

// Rider position — arrow / chevron, rotated along path direction
function RiderMarker({ pct, accent, dark }) {
  const pts = getPathPoints();
  if (!pts.length) return null;
  const i = Math.min(pts.length - 2, Math.max(0, Math.floor((pct / 100) * pts.length)));
  const p0 = pts[i];
  const p1 = pts[i + 1];
  const angle = Math.atan2(p1.y - p0.y, p1.x - p0.x) * 180 / Math.PI;
  return (
    <g transform={`translate(${p0.x} ${p0.y}) rotate(${angle})`}>
      <circle r="22" fill={accent} opacity="0.15" />
      <circle r="16" fill={accent} opacity="0.25" />
      <g transform="rotate(-90)">
        <path d="M 0 -10 L 8 8 L 0 3 L -8 8 Z" fill={accent}
          stroke={dark ? '#0E0E10' : '#F5EFE6'} strokeWidth="1.5" strokeLinejoin="round" />
      </g>
    </g>
  );
}

// The actual Map view
function TarmotoMap({
  progress = 40,      // 0..100 along the route
  theme = 'dark',     // 'light' | 'dark' | 'oled'
  mapStyle = 'heatmap', // 'heatmap' | 'topo' | 'hybrid'
  qualityMin = 1,     // 1..5; hide segments worse than this
  accent = '#FF6A1A',
  width = 402,
  height = 600,
  showLabels = true,
}) {
  const dark = theme !== 'light';
  const bg = theme === 'oled' ? '#000' : theme === 'dark' ? '#17181C' : '#EDE6DA';
  const roadBase = dark ? '#2B2C30' : '#D4CBBA';
  const labelColor = dark ? 'rgba(245,239,230,0.85)' : 'rgba(14,14,16,0.85)';
  const labelSub = dark ? 'rgba(245,239,230,0.5)' : 'rgba(14,14,16,0.55)';

  return (
    <div style={{ position: 'absolute', inset: 0, background: bg, overflow: 'hidden' }}>
      {/* grain */}
      <div style={{
        position: 'absolute', inset: 0, opacity: 0.06, pointerEvents: 'none',
        backgroundImage:
          'radial-gradient(circle at 20% 30%, rgba(255,106,26,0.3) 0, transparent 30%),' +
          'radial-gradient(circle at 80% 70%, rgba(255,106,26,0.2) 0, transparent 40%)',
      }} />

      <svg viewBox="0 0 1040 720" preserveAspectRatio="xMidYMid slice"
        style={{ position: 'absolute', inset: 0, width: '100%', height: '100%' }}>
        <defs>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none"
              stroke={dark ? 'rgba(255,255,255,0.04)' : 'rgba(14,14,16,0.05)'} strokeWidth="0.5" />
          </pattern>
        </defs>

        {mapStyle !== 'heatmap' && <rect width="1040" height="720" fill="url(#grid)" />}

        {(mapStyle === 'topo' || mapStyle === 'hybrid') && <TopoContours dark={dark} />}
        <Mountains dark={dark} />

        {/* Road base */}
        <path d={ROAD_D} stroke={dark ? '#1A1B1E' : '#C4BBA8'} strokeWidth="13" fill="none" strokeLinecap="round" />
        <path d={ROAD_D} stroke={roadBase} strokeWidth="11" fill="none" strokeLinecap="round" />

        {/* Quality overlay */}
        {mapStyle !== 'topo' && ROAD_SEGMENTS.filter(s => s.q >= qualityMin).map((s, i) => (
          <SegmentPath key={i} {...s} mapStyle={mapStyle} />
        ))}

        {/* Dashed centerline for style */}
        <path d={ROAD_D} stroke={dark ? 'rgba(245,239,230,0.25)' : 'rgba(14,14,16,0.3)'}
          strokeWidth="0.8" fill="none" strokeDasharray="4 8" />

        {/* Waypoints */}
        {WAYPOINTS.map((wp, i) => <WaypointMarker key={i} wp={wp} accent={accent} dark={dark} mapStyle={mapStyle} />)}

        {/* Hazards */}
        {HAZARDS.map((h, i) => <HazardMarker key={i} h={h} accent={accent} />)}

        {/* Rider */}
        <RiderMarker pct={progress} accent={accent} dark={dark} />

        {/* Waypoint labels */}
        {showLabels && WAYPOINTS.map((wp, i) => {
          const pos = pointAt(wp.at);
          return (
            <g key={i} transform={`translate(${pos.x + 18} ${pos.y - 8})`}>
              <text fontSize="13" fontWeight="700" fill={labelColor}
                fontFamily="'Space Grotesk', system-ui">{wp.name}</text>
              <text y="14" fontSize="10" fontWeight="500" fill={labelSub}
                fontFamily="'JetBrains Mono', monospace">{wp.sub}</text>
            </g>
          );
        })}
      </svg>
    </div>
  );
}

Object.assign(window, {
  TarmotoMap, ROAD_D, ROAD_SEGMENTS, HAZARDS, WAYPOINTS, QUALITY_COLORS,
  pointAt, samplePath, getPathPoints,
});

</script>

  .twk-btn.secondary:hover{background:rgba(0,0,0,.1)}

    transition:transform .12s cubic-bezier(.3,.7,.4,1),box-shadow .12s}
  .twk-chip:hover{transform:translateY(-1px);
    box-shadow:0 0 0 .5px rgba(0,0,0,.18),0 4px 10px rgba(0,0,0,.12)}

    0 2px 6px rgba(0,0,0,.15)}

    display:flex;flex-direction:column;box-shadow:-1px 0 0 rgba(0,0,0,.1)}

    filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
`;

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

</script>
<script type="text/babel" data-src="mobile/tokens.jsx">
// tokens.jsx — Tarmoto mobile design tokens + shared atoms.
// Three look/feel directions (Atlas / Onyx / Rally) × light/dark, resolved into one

const QC = ['#E05A3C', '#F0A03C', '#E8D66A', '#C7D36A', '#6FD38A']; // q1..q5
const QLABEL = ['Avoid', 'Rough', 'Fair', 'Great', 'Hero'];
const QFULL = ['Very poor', 'Poor', 'Fair', 'Good', 'Excellent'];

function resolveTokens(cfg) {
  const dir = cfg.direction || 'atlas';
  const dark = cfg.theme === 'dark';

  const light = {
    bg: '#F5EFE6', raised: '#FFFFFF', raised2: '#EDE6DA', sunken: '#E7DECF',
    fg: '#0E0E10', dim: 'rgba(14,14,16,0.60)', mute: 'rgba(14,14,16,0.42)', faint: 'rgba(14,14,16,0.20)',
    line: 'rgba(14,14,16,0.10)', lineStrong: 'rgba(14,14,16,0.16)',
    invBg: '#0E0E10', invFg: '#F5EFE6', invDim: 'rgba(245,239,230,0.62)', invLine: 'rgba(245,239,230,0.14)',
    qEmpty: 'rgba(14,14,16,0.08)',
  };
  const night = {
    bg: '#111216', raised: '#1B1D23', raised2: '#23262D', sunken: '#0B0C0F',
    fg: '#F3EEE6', dim: 'rgba(243,238,230,0.62)', mute: 'rgba(243,238,230,0.42)', faint: 'rgba(243,238,230,0.22)',
    line: 'rgba(243,238,230,0.10)', lineStrong: 'rgba(243,238,230,0.18)',
    invBg: '#F3EEE6', invFg: '#0E0E10', invDim: 'rgba(14,14,16,0.60)', invLine: 'rgba(14,14,16,0.12)',
    qEmpty: 'rgba(243,238,230,0.10)',
  };
  const s = dark ? night : light;
  const accent = '#FF6A1A';

  const persona = {
    atlas: { name: 'Atlas', r: 18, rLg: 24, rSm: 12, glow: false, h1: 30, track: -0.6, chunk: false, blurb: 'Editorial cartography' },
    onyx: { name: 'Onyx', r: 16, rLg: 22, rSm: 11, glow: true, h1: 28, track: -0.4, chunk: false, blurb: 'Instrument cluster' },
    rally: { name: 'Rally', r: 26, rLg: 32, rSm: 14, glow: false, h1: 36, track: -1.1, chunk: true, blurb: 'Loud & sporty' },
  }[dir];

  return {
    dir, dark, accent, QC, QLABEL, QFULL,
    land: cfg.orient === 'landscape',
    sans: "'Space Grotesk', system-ui, sans-serif",
    mono: "'JetBrains Mono', monospace",
    ...s, ...persona,
  };
}

const TokenCtx = React.createContext(resolveTokens({ direction: 'atlas', theme: 'light' }));
const useT = () => React.useContext(TokenCtx);

// ── Stamp: mono uppercase micro-label ───────────────────────────
function Stamp({ children, color, size = 10, style }) {
  const t = useT();
  return <span style={{
    fontFamily: t.mono, fontSize: size, fontWeight: 700, letterSpacing: 1.4,
    textTransform: 'uppercase', color: color || t.mute, whiteSpace: 'nowrap', ...style,
  }}>{children}</span>;
}

// ── Quality bars ────────────────────────────────────────────────
function QBars({ q, size = 7, gap = 2, empty }) {
  const t = useT();
  return <span style={{ display: 'inline-flex', gap, verticalAlign: 'middle' }}>
    {[1, 2, 3, 4, 5].map(n => (
      <span key={n} style={{
        width: size, height: size * 1.85, borderRadius: 2,
        background: n <= q ? QC[q - 1] : (empty || t.qEmpty),
      }} />
    ))}
  </span>;
}

// ── Chip / toggle pill ──────────────────────────────────────────
function Chip({ children, active, onClick, accent, dark, style }) {
  const t = useT();
  const onDark = dark;
  return <button onClick={onClick} style={{
    display: 'inline-flex', alignItems: 'center', gap: 6, padding: '8px 13px',
    borderRadius: 999, cursor: 'pointer', whiteSpace: 'nowrap',
    fontFamily: t.sans, fontWeight: 700, fontSize: 12.5, letterSpacing: 0.1,
    border: '1px solid ' + (active ? 'transparent' : (onDark ? t.invLine : t.line)),
    background: active ? (accent ? t.accent : (onDark ? '#F3EEE6' : t.fg)) : (onDark ? 'rgba(255,255,255,0.06)' : 'transparent'),
    color: active ? (accent ? '#0E0E10' : (onDark ? '#0E0E10' : t.bg)) : (onDark ? '#F3EEE6' : t.fg),
    transition: 'all 140ms ease', ...style,
  }}>{children}</button>;
}

// ── Big metric block ────────────────────────────────────────────
function Metric({ value, unit, label, color, onDark, size = 26, align = 'left' }) {
  const t = useT();
  return <div style={{ textAlign: align }}>
    <div style={{ fontFamily: t.sans, fontWeight: 800, fontSize: size, lineHeight: 1, letterSpacing: -0.5,
      color: color || (onDark ? '#F3EEE6' : t.fg), display: 'flex', alignItems: 'baseline', gap: 3,
      justifyContent: align === 'center' ? 'center' : 'flex-start' }}>
      {value}{unit && <span style={{ fontFamily: t.mono, fontSize: size * 0.4, fontWeight: 600,
        color: onDark ? t.invDim : t.mute }}>{unit}</span>}
    </div>
    {label && <div style={{ marginTop: 5 }}><Stamp size={9} color={onDark ? t.invDim : t.mute}>{label}</Stamp></div>}
  </div>;
}

// ── Icon set — hand-rolled stroke icons (Lucide-ish, geometric) ──
function Icon({ name, size = 22, color = 'currentColor', sw = 1.8, fill = 'none', style }) {
  const p = { stroke: color, strokeWidth: sw, fill, strokeLinecap: 'round', strokeLinejoin: 'round' };
  const paths = {
    home: <><path d="M3 11.5 12 4l9 7.5" {...p} /><path d="M6 10v9h12v-9" {...p} /></>,
    roads: <><circle cx="12" cy="12" r="8.4" {...p} /><path d="M3.6 12H20.4M12 3.6c2.6 2.4 2.6 14.4 0 16.8M12 3.6c-2.6 2.4-2.6 14.4 0 16.8" {...p} /></>,
    route: <><circle cx="6" cy="18" r="2.4" {...p} /><circle cx="18" cy="6" r="2.4" {...p} /><path d="M8.4 18H14a3.5 3.5 0 0 0 0-7H10a3.5 3.5 0 0 1 0-7h5.6" {...p} /></>,

        <path key={i} d={`M -10 ${y} C 60 ${y - 12}, 150 ${y + 14}, 230 ${y - 6} S 360 ${y + 8}, 400 ${y - 4}`} stroke={topo} strokeWidth="1" fill="none" />

      <path d="M 8 132 C 50 126, 86 108, 116 112 C 150 116, 184 98, 212 88 C 238 80, 262 64, 286 62 C 320 58, 352 40, 374 26" stroke={base} strokeWidth="9" fill="none" strokeLinecap="round" />

      {progress > 0 && (() => {

// ── CRASH DETECTION ─────────────────────────────────────────────
function CrashScreen({ onCancel }) {
  const t = useT();
  const [n, setN] = React.useState(12);
  React.useEffect(() => {
    const iv = setInterval(() => setN(v => (v <= 0 ? 0 : v - 1)), 1000);
    return () => clearInterval(iv);
  }, []);
  const calling = n <= 0;
  const R = 96, C = 2 * Math.PI * R, frac = n / 12;

  if (t.land) {
    const R2 = 78, C2 = 2 * Math.PI * R2;
    return <Screen bg={QC[0]} style={{ color: '#F5EFE6' }}>
      <StatusBar onDark time="14:07" />

            {calling ? 'I’m safe — stand down' : 'I’m okay — cancel'}</button>
          <div style={{ marginTop: 12, fontFamily: t.mono, fontSize: 11, opacity: 0.85, letterSpacing: 0.5 }}>WILL CALL → ELENA · DANI · 112</div>
        </div>
        <div style={{ position: 'relative', width: 196, height: 196, flexShrink: 0, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          <svg width="196" height="196" viewBox="0 0 196 196" style={{ position: 'absolute', inset: 0 }}>
            <circle cx="98" cy="98" r={R2} fill="rgba(14,14,16,0.16)" stroke="rgba(245,239,230,0.3)" strokeWidth="2" />
            <circle cx="98" cy="98" r={R2} fill="none" stroke="#F5EFE6" strokeWidth="6" strokeLinecap="round" strokeDasharray={C2} strokeDashoffset={C2 * (1 - frac)} transform="rotate(-90 98 98)" style={{ transition: 'stroke-dashoffset 1s linear' }} />
          </svg>
          <div style={{ textAlign: 'center' }}>
            {calling ? <Icon name="phone" size={54} color="#F5EFE6" sw={1.6} />
              : <><div style={{ fontFamily: t.sans, fontWeight: 800, fontSize: 72, lineHeight: 1, letterSpacing: -2 }}>{n}</div><Stamp color="rgba(245,239,230,0.75)">seconds</Stamp></>}
          </div>
        </div>
      </div>
    </Screen>;
  }

  return <Screen bg={QC[0]} style={{ color: '#F5EFE6', alignItems: 'center' }}>
    <style>{`@keyframes crashpulse{0%{transform:translateX(-50%) scale(0.75);opacity:0.6}100%{transform:translateX(-50%) scale(1.35);opacity:0}}`}</style>
    <StatusBar onDark time="14:07" />
    <div style={{ position: 'absolute', top: 230, left: '50%', width: 240, height: 240, borderRadius: 999, border: '2px solid rgba(245,239,230,0.35)', animation: 'crashpulse 1.6s ease-out infinite' }} />

        {calling ? 'Hold tight.' : 'Are you okay?'}

        {calling ? 'Sharing your live location with Elena and emergency services now.' : <>Hard impact detected near <b>SS38 km 47</b>. We’ll alert your contacts unless you cancel.</>}
      </div>
    </div>
    <div style={{ position: 'relative', width: 240, height: 240, margin: '34px auto 0', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 2 }}>

const HAZARD_TYPES = [

              border: '1.5px solid ' + (on ? c : t.line),

          })}
        </div>
      </div>

      <div style={{ marginTop: 18, padding: '13px 14px', borderRadius: t.rSm + 2, background: onDark ? t.raised : t.raised2, border: '1px solid ' + t.line, display: 'flex', alignItems: 'center', gap: 11 }}>

}

function ProfileScreen({ cfg, onSettings }) {

          <div style={{ fontFamily: t.mono, fontSize: 11.5, color: t.mute, marginTop: 3 }}>Ducati Monster · Bolzano</div>

        <div style={{ display: 'inline-flex', alignItems: 'center', gap: 6, padding: '6px 11px', borderRadius: 999, background: t.invBg, color: t.invFg, fontFamily: t.sans, fontWeight: 800, fontSize: 11 }}>
          <span style={{ width: 6, height: 6, borderRadius: 9, background: t.accent }} /> PRO

<script type="text/babel" data-src="mobile/screens-d.jsx">
// screens-d.jsx — Calimoto-style quick round-trip planner: generator + result.

// ── Direction wheel ─────────────────────────────────────────────
const DIRS = [
  { id: 'N', a: -90 }, { id: 'NE', a: -45 }, { id: 'E', a: 0 }, { id: 'SE', a: 45 },
  { id: 'S', a: 90 }, { id: 'SW', a: 135 }, { id: 'W', a: 180 }, { id: 'NW', a: -135 },
];
function DirectionWheel({ value, onChange, onDark }) {
  const t = useT();
  const S = 170, c = S / 2, r = 64;
  const line = onDark ? t.invLine : t.line;
  const sel = DIRS.find(d => d.id === value);
  return <div style={{ position: 'relative', width: S, height: S, margin: '0 auto' }}>
    <svg width={S} height={S} viewBox={`0 0 ${S} ${S}`} style={{ position: 'absolute', inset: 0 }}>
      <circle cx={c} cy={c} r={r} fill="none" stroke={line} strokeWidth="1.5" />
      <circle cx={c} cy={c} r={r + 14} fill="none" stroke={line} strokeWidth="1" strokeDasharray="2 5" opacity="0.6" />
      {sel && <line x1={c} y1={c} x2={c + Math.cos(sel.a * Math.PI / 180) * r} y2={c + Math.sin(sel.a * Math.PI / 180) * r} stroke={t.accent} strokeWidth="2.5" strokeLinecap="round" />}
    </svg>
    {DIRS.map(d => {
      const on = value === d.id;
      const x = c + Math.cos(d.a * Math.PI / 180) * r, y = c + Math.sin(d.a * Math.PI / 180) * r;
      return <button key={d.id} onClick={() => onChange(d.id)} style={{
        position: 'absolute', left: x - 17, top: y - 17, width: 34, height: 34, borderRadius: 999, cursor: 'pointer',
        background: on ? t.accent : (onDark ? 'rgba(255,255,255,0.06)' : t.raised), color: on ? '#0E0E10' : t.dim,
        border: '1px solid ' + (on ? 'transparent' : line), fontFamily: t.mono, fontWeight: 700, fontSize: 11,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
      }}>{d.id}</button>;
    })}
    <button onClick={() => onChange('any')} style={{
      position: 'absolute', left: c - 30, top: c - 30, width: 60, height: 60, borderRadius: 999, cursor: 'pointer',
      background: value === 'any' ? t.fg : (onDark ? 'rgba(255,255,255,0.05)' : t.raised2),
      color: value === 'any' ? t.bg : t.dim, border: '1px solid ' + line,
      display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 2,
    }}>
      <Icon name="nav" size={18} color={value === 'any' ? t.bg : t.dim} sw={2} />
      <span style={{ fontFamily: t.mono, fontSize: 8, fontWeight: 700, letterSpacing: 0.5 }}>ANY</span>
    </button>
  </div>;
}

// ── Notched level selector (curviness) ──────────────────────────
function LevelPicker({ value, onChange, labels, onDark }) {
  const t = useT();
  return <div style={{ display: 'flex', gap: 6 }}>
    {labels.map((lab, i) => {
      const on = value === i;
      const reached = i <= value;
      return <button key={i} onClick={() => onChange(i)} style={{
        flex: 1, padding: '10px 4px', borderRadius: t.rSm, cursor: 'pointer', textAlign: 'center',
        background: reached ? t.accent + (on ? 'ff' : '26') : (onDark ? t.raised : t.raised),
        border: '1px solid ' + (on ? t.accent : (onDark ? t.invLine : t.line)),
      }}>
        <div style={{ display: 'flex', justifyContent: 'center', gap: 2, marginBottom: 5 }}>
          {Array.from({ length: i + 1 }).map((_, k) => <span key={k} style={{ width: 2.5, height: 9 + k * 2, borderRadius: 2, background: on ? '#0E0E10' : (reached ? t.accent : t.faint) }} />)}
        </div>
        <span style={{ fontFamily: t.sans, fontWeight: 700, fontSize: 10.5, color: on ? '#0E0E10' : t.dim }}>{lab}</span>
      </button>;
    })}
  </div>;
}

// ── QUICK PLAN (generator) ──────────────────────────────────────
function QuickPlanScreen({ onGenerate, embedded }) {
  const t = useT();
  const onDark = t.dark;
  const [dur, setDur] = React.useState(1); // index into DURS
  const [heading, setHeading] = React.useState('NE');

  const DURS = [['1 h', '~48 km'], ['2 h', '~95 km'], ['3 h', '~150 km'], ['Half day', '~230 km']];

  return <Screen onDark={onDark}>
    <StatusBar onDark={onDark} />
    <div style={{ padding: t.land ? '6px 20px 4px ' + (LAND_RAIL + 36) + 'px' : '6px 20px 4px', flexShrink: 0 }}>
      <Stamp>Quick ride</Stamp>
      <div style={{ fontFamily: t.sans, fontWeight: 800, fontSize: t.h1, letterSpacing: t.track, marginTop: 2 }}>Round trip</div>
      <div style={{ fontSize: 13, color: t.dim, marginTop: 4 }}>A loop from here, back to here — built around good tarmac.</div>
    </div>
    <Scroll pad={20} bottomPad={110}>
      {/* start point */}
      <div style={{ display: 'flex', alignItems: 'center', gap: 11, padding: '13px 14px', borderRadius: t.rSm + 2, background: onDark ? t.raised : t.raised2, border: '1px solid ' + t.line, marginTop: 4 }}>
        <Icon name="pin" size={20} color={t.accent} />
        <div style={{ flex: 1 }}>
          <Stamp size={9}>Start & finish</Stamp>
          <div style={{ fontFamily: t.sans, fontWeight: 700, fontSize: 14, marginTop: 2 }}>Current location · Bolzano</div>
        </div>
        <Icon name="settings" size={18} color={t.faint} />
      </div>

      {/* how long */}
      <div style={{ marginTop: 20 }}>
        <Stamp>How long do you have?</Stamp>
        <div style={{ marginTop: 9, display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8 }}>
          {DURS.map(([lab, km], i) => {
            const on = dur === i;
            return <button key={lab} onClick={() => setDur(i)} style={{
              display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '14px 16px', cursor: 'pointer',
              borderRadius: t.r, background: on ? t.fg : (onDark ? t.raised : t.raised), color: on ? t.bg : t.fg,
              border: '1px solid ' + (on ? 'transparent' : t.line),
            }}>
              <span style={{ fontFamily: t.sans, fontWeight: 800, fontSize: 16 }}>{lab}</span>
              <span style={{ fontFamily: t.mono, fontSize: 11, color: on ? 'rgba(245,239,230,0.65)' : t.mute }}>{km}</span>
            </button>;
          })}
        </div>
      </div>

      {/* direction */}
      <div style={{ marginTop: 22 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
          <Stamp>Which way?</Stamp>
          <Stamp size={9} color={t.accent}>{heading === 'any' ? 'Surprise me' : 'Head ' + heading}</Stamp>
        </div>
        <div style={{ marginTop: 12 }}><DirectionWheel value={heading} onChange={setHeading} onDark={onDark} /></div>
      </div>

      {/* curviness */}
      <div style={{ marginTop: 18 }}>
        <Stamp>Curviness</Stamp>
        <div style={{ marginTop: 9 }}>
          <LevelPicker value={twist} onChange={setTwist} onDark={onDark} labels={['Mellow', 'Easy', 'Mixed', 'Twisty', 'Wild']} />
        </div>
      </div>

      {/* avoid */}
      <div style={{ marginTop: 20 }}>
        <Stamp>Avoid</Stamp>
        <div style={{ marginTop: 9, display: 'flex', gap: 8, flexWrap: 'wrap' }}>
          <Chip active={avoid.highways} accent={avoid.highways} dark={onDark} onClick={() => tog('highways')}>No highways</Chip>
          <Chip active={avoid.paved} accent={avoid.paved} dark={onDark} onClick={() => tog('paved')}>Paved only</Chip>
          <Chip active={avoid.tolls} accent={avoid.tolls} dark={onDark} onClick={() => tog('tolls')}>Avoid tolls</Chip>
        </div>
      </div>
    </Scroll>

    {/* sticky generate */}
    <div style={{ position: 'absolute', left: t.land ? LAND_RAIL + 24 : 0, right: 0, bottom: 0, padding: '14px 20px',
      paddingBottom: t.land ? 16 : (embedded ? 100 : 34),
      background: `linear-gradient(to top, ${t.bg} 62%, transparent)`, zIndex: 20 }}>
      <div style={{ maxWidth: t.land ? 660 : 'none', margin: '0 auto' }}>
        <Btn accent onDark={onDark} size="lg" onClick={() => onGenerate({ dur, heading, twist })}
          icon={<Icon name="bolt" size={19} color="#0E0E10" sw={2} />}>Generate loop</Btn>
      </div>
    </div>
  </Screen>;
}

// ── ROUTE RESULT (generated loop) ───────────────────────────────
const ROUTE_VARIANTS = [
  { id: 0, name: 'Dolomiti quick loop', km: 95, dur: '2h 10m', turns: 64, elev: '+1,420 m', twist: 4, q: 4, prog: 35,
    zones: [['Passo Pinei', 5], ['Val Gardena ridge', 4], ['Renon switchbacks', 3]] },
  { id: 1, name: 'Eggental twister', km: 88, dur: '2h 02m', turns: 78, elev: '+1,610 m', twist: 5, q: 3, prog: 60,
    zones: [['Karerpass', 4], ['Nigerpass', 5], ['Eggental gorge', 3]] },
  { id: 2, name: 'Adige valley cruise', km: 102, dur: '2h 16m', turns: 41, elev: '+780 m', twist: 2, q: 5, prog: 20,
    zones: [['Mendola climb', 4], ['Lake Caldaro', 5]] },
];

function RouteResultScreen({ cfg, onBack, onStart, onShuffle, embedded }) {
  const t = useT();
  const [v, setV] = React.useState(0);
  const r = ROUTE_VARIANTS[v];
  const mapDark = mapThemeFromCfg(cfg) !== 'light';
  return <Screen onDark>
    <div style={{ position: 'absolute', inset: 0, ...(t.land ? {} : { height: '46%' }) }}>
      <div style={{ position: 'relative', width: '100%', height: '100%' }}>
        <TarmotoMap theme={mapThemeFromCfg(cfg)} mapStyle="heatmap" progress={r.prog} accent={t.accent} showLabels={false} />
      </div>
    </div>
    <StatusBar onDark={mapDark} />
    {!t.land && <div style={{ position: 'absolute', top: 50, left: 16, zIndex: 14 }}>
      <button onClick={onBack} style={{ width: 42, height: 42, borderRadius: 999, border: 'none', cursor: 'pointer',
        background: mapDark ? 'rgba(14,14,16,0.55)' : 'rgba(245,239,230,0.85)', backdropFilter: 'blur(12px)',
        display: 'flex', alignItems: 'center', justifyContent: 'center', color: mapDark ? '#F5EFE6' : '#0E0E10', boxShadow: '0 6px 18px rgba(14,14,16,0.2)' }}>

    <div style={{ ...sheetStyle(t, { maxH: '64%' }) }}>
      {!t.land && <div style={{ width: 42, height: 5, borderRadius: 9, background: t.faint, margin: '12px auto 0', flexShrink: 0 }} />}
      <div style={{ overflowY: 'auto', padding: t.land ? '14px 16px 16px' : '12px 20px ' + (embedded ? '110px' : '30px') }}>
        {t.land && <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 12 }}>
          <button onClick={onBack} style={{ width: 36, height: 36, borderRadius: 999, border: '1px solid ' + t.line, background: t.raised, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', color: t.fg, flexShrink: 0 }}><Icon name="left" size={19} /></button>
          <div style={{ flex: 1 }} />
          {ROUTE_VARIANTS.map((rv, i) => (
            <button key={i} onClick={() => setV(i)} style={{ width: 34, height: 34, borderRadius: 10, cursor: 'pointer', border: 'none', fontFamily: t.sans, fontWeight: 800, fontSize: 13, background: v === i ? t.accent : t.raised2, color: v === i ? '#0E0E10' : t.fg }}>{String.fromCharCode(65 + i)}</button>
          ))}
        </div>}
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 12 }}>
          <div style={{ flex: 1 }}>
            <Stamp>Round trip · loop {String.fromCharCode(65 + v)}</Stamp>
            <div style={{ fontFamily: t.sans, fontWeight: 800, fontSize: 23, letterSpacing: -0.5, marginTop: 4 }}>{r.name}</div>
          </div>
          <div style={{ textAlign: 'center', flexShrink: 0 }}>
            <div style={{ display: 'flex', gap: 2, justifyContent: 'center' }}>
              {[1, 2, 3, 4, 5].map(n => <span key={n} style={{ width: 4, height: 14, borderRadius: 2, background: n <= r.twist ? t.accent : t.qEmpty }} />)}
            </div>
            <div style={{ marginTop: 4 }}><Stamp size={9}>Twisty {r.twist}/5</Stamp></div>
          </div>
        </div>

        <div style={{ marginTop: 14, display: 'grid', gridTemplateColumns: '1fr 1fr 1fr 1fr', gap: 8 }}>
          {[[r.km, 'KM'], [r.dur, 'TIME'], [r.turns, 'TURNS'], [r.elev.replace(' m', ''), 'M GAIN']].map(([val, l]) => (
            <div key={l}>
              <div style={{ fontFamily: t.sans, fontWeight: 800, fontSize: 18, lineHeight: 1 }}>{val}</div>
              <div style={{ marginTop: 4 }}><Stamp size={9}>{l}</Stamp></div>
            </div>
          ))}
        </div>

        <div style={{ marginTop: 14, display: 'flex', alignItems: 'center', gap: 10, padding: '11px 13px', borderRadius: t.rSm + 2, background: t.raised2, border: '1px solid ' + t.line }}>
          <QBars q={r.q} size={7} />
          <div style={{ flex: 1, fontSize: 12.5 }}><b>{QFULL[r.q - 1]} tarmac</b> overall · {r.zones.length} fun zones on this loop</div>
        </div>

        <div style={{ marginTop: 14, marginBottom: 8 }}><Stamp>Fun zones</Stamp></div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
          {r.zones.map(([name, q], i) => (
            <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '11px 13px', borderRadius: t.rSm + 2, background: t.raised, border: '1px solid ' + t.line }}>
              <div style={{ width: 28, height: 28, borderRadius: 999, background: t.bg, border: '1px solid ' + t.line, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0, fontFamily: t.mono, fontWeight: 700, fontSize: 12 }}>{i + 1}</div>
              <div style={{ flex: 1, fontFamily: t.sans, fontWeight: 700, fontSize: 14 }}>{name}</div>
              <QBars q={q} size={6} />
            </div>
          ))}
        </div>

        <div style={{ display: 'flex', gap: 10, marginTop: 16 }}>
          <button onClick={() => onShuffle && setV((v + 1) % ROUTE_VARIANTS.length)} style={{
            flex: 1, padding: '14px', borderRadius: 14, cursor: 'pointer', background: 'transparent', color: t.fg,
            border: '1px solid ' + t.lineStrong, fontFamily: t.sans, fontWeight: 800, fontSize: 14,
            display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8 }}>
            <Icon name="bolt" size={17} /> Shuffle</button>
          <div style={{ flex: 1.4 }}><Btn accent onClick={onStart} icon={<Icon name="nav" size={18} color="#0E0E10" sw={2} />}>Start ride</Btn></div>
        </div>
      </div>
    </div>
  </Screen>;
}

// ── Interactive flow wrapper (Plan tab) ─────────────────────────
function PlannerScreen({ cfg, onStart }) {
  const [stage, setStage] = React.useState('form');
  if (stage === 'result') return <RouteResultScreen cfg={cfg} embedded onBack={() => setStage('form')} onStart={onStart} onShuffle />;
  return <QuickPlanScreen embedded onGenerate={() => setStage('result')} />;
}

Object.assign(window, { QuickPlanScreen, RouteResultScreen, PlannerScreen, DirectionWheel });

</script>

// ── AUTH (welcome → signin → signup) ────────────────────────────

          }}>{isSignup ? 'Sign in' : 'Create one'}</button>

}

// ── SETTINGS ────────────────────────────────────────────────────
function Toggle({ on, onClick, t }) {
  return <button onClick={onClick} style={{
    width: 46, height: 28, borderRadius: 999, border: 'none', cursor: 'pointer', flexShrink: 0,
    background: on ? t.accent : (t.dark ? 'rgba(243,238,230,0.18)' : 'rgba(14,14,16,0.16)'),

}

function SettingsScreen({ cfg, onBack }) {
  const t = useT();
  const onDark = t.dark;
  const [tog, setTog] = React.useState({ crash: true, hazardAlerts: true, voice: true, autopause: true, offline: false, share: true });
  const flip = (k) => setTog(s => ({ ...s, [k]: !s[k] }));

  const Section = ({ label, children }) => (
    <div style={{ marginTop: 22 }}>
      <div style={{ marginBottom: 9, paddingLeft: 2 }}><Stamp>{label}</Stamp></div>
      <Card raised pad={0} style={{ overflow: 'hidden' }}>{children}</Card>

  const Row = ({ icon, title, sub, right, last, danger }) => (
    <div style={{ display: 'flex', alignItems: 'center', gap: 13, padding: '14px 16px', borderBottom: last ? 'none' : '1px solid ' + t.line }}>
      <div style={{ width: 34, height: 34, borderRadius: 9, flexShrink: 0, background: danger ? QC[0] + '22' : (onDark ? 'rgba(255,255,255,0.06)' : t.bg), border: '1px solid ' + (danger ? QC[0] + '55' : t.line), display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        <Icon name={icon} size={18} color={danger ? QC[0] : t.dim} />

      <div style={{ flex: 1 }}>

        {sub && <div style={{ fontFamily: t.mono, fontSize: 11, color: t.mute, marginTop: 2 }}>{sub}</div>}
      </div>
      {right}

  );
  const Chev = <Icon name="right" size={17} color={t.faint} />;

  return <Screen onDark={onDark}>
    <StatusBar onDark={onDark} />
    <TopBar title="Settings" onBack={onBack} onDark={onDark} />
    <Scroll pad={20} bottomPad={120}>
      {/* account header */}
      <div style={{ display: 'flex', alignItems: 'center', gap: 14, padding: '6px 4px 2px' }}>
        <Avatar size={56} />
        <div style={{ flex: 1 }}>
          <div style={{ fontFamily: t.sans, fontWeight: 800, fontSize: 19, letterSpacing: -0.3 }}>Luca Moretti</div>
          <div style={{ fontFamily: t.mono, fontSize: 11.5, color: t.mute, marginTop: 2 }}>luca@moretti.cc</div>
        </div>
        <div style={{ display: 'inline-flex', alignItems: 'center', gap: 6, padding: '6px 11px', borderRadius: 999, background: t.invBg, color: t.invFg, fontFamily: t.sans, fontWeight: 800, fontSize: 11 }}>
          <span style={{ width: 6, height: 6, borderRadius: 9, background: t.accent }} /> PRO
        </div>
      </div>

      <Section label="Safety">
        <Row icon="heart" title="Crash detection" sub="Auto-alert contacts after a hard impact" right={<Toggle on={tog.crash} onClick={() => flip('crash')} t={t} />} />
        <Row icon="alert" title="Hazard alerts" sub="Warn me about hazards ahead" right={<Toggle on={tog.hazardAlerts} onClick={() => flip('hazardAlerts')} t={t} />} />
        <Row icon="user" title="Emergency contacts" sub="Elena · Dani" right={Chev} last />
      </Section>

      <Section label="Navigation & ride">
        <Row icon="speed" title="Voice guidance" sub="Spoken turn-by-turn" right={<Toggle on={tog.voice} onClick={() => flip('voice')} t={t} />} />
        <Row icon="clock" title="Auto-pause" sub="Pause tracking when stopped" right={<Toggle on={tog.autopause} onClick={() => flip('autopause')} t={t} />} />
        <Row icon="gauge" title="Units" sub="Metric · km, °C" right={Chev} />
        <Row icon="route" title="Avoid by default" sub="Highways, tolls" right={Chev} last />
      </Section>

      <Section label="Data & maps">
        <Row icon="layers" title="Offline maps" sub="Download regions for no-signal rides" right={<Toggle on={tog.offline} onClick={() => flip('offline')} t={t} />} />
        <Row icon="share" title="Share my road data" sub="Help improve quality maps" right={<Toggle on={tog.share} onClick={() => flip('share')} t={t} />} />
        <Row icon="trend" title="Storage" sub="1.2 GB cached" right={Chev} last />
      </Section>

      <Section label="Account">
        <Row icon="settings" title="Personal details" right={Chev} />
        <Row icon="phone" title="Linked devices" sub="2 connected" right={Chev} />
        <Row icon="bolt" title="Manage subscription" sub="Tarmoto Pro · renews May 4" right={Chev} last />
      </Section>

      <div style={{ marginTop: 22 }}>
        <Card raised pad={0} style={{ overflow: 'hidden' }}>
          <Row icon="left" title="Sign out" right={Chev} last />
        </Card>
      </div>

      <div style={{ marginTop: 18, textAlign: 'center' }}>
        <Stamp size={10} color={t.mute}>Tarmoto 2.4.0 · build 1840</Stamp>
      </div>
    </Scroll>
  </Screen>;
}

Object.assign(window, { AuthScreen, SettingsScreen });

</script>
<script type="text/babel" data-src="mobile/app.jsx">
// app.jsx — top-level: router, control rail, gallery, tweaks wiring.

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "direction": "atlas",
  "theme": "light",
  "mapStyle": "dark",
  "homeLayout": "map",
  "navStyle": "bar",
  "orient": "portrait"
}/*EDITMODE-END*/;

const SCENES = [
  { id: 'auth', label: 'Welcome / sign in', nav: false },
  { id: 'signup', label: 'Sign up', nav: false },
  { id: 'home', label: 'Home', nav: true },
  { id: 'plan', label: 'Quick planner', nav: true },
  { id: 'route', label: 'Generated route', nav: true },
  { id: 'roads', label: 'Road explorer', nav: true },
  { id: 'ride', label: 'Ride mode', nav: false },
  { id: 'hazard', label: 'Hazard report', nav: false },
  { id: 'crash', label: 'Crash detection', nav: false },
  { id: 'postride', label: 'Post-ride summary', nav: false },
  { id: 'me', label: 'Profile', nav: true },
  { id: 'settings', label: 'Settings', nav: false },
];

function navTabFor(id) {
  if (id === 'plan' || id === 'route') return 'plan';
  if (id === 'roads') return 'roads';
  if (id === 'me') return 'me';
  return 'home';
}

function Wordmark({ dark }) {
  const c = dark ? '#F3EEE6' : '#0E0E10';
  return <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
    <svg width="26" height="26" viewBox="0 0 26 26"><path d="M3 21 13 5l10 16H3Z" fill="none" stroke={c} strokeWidth="2.2" strokeLinejoin="round" /><path d="M9.5 21 13 15l3.5 6" fill="none" stroke="#FF6A1A" strokeWidth="2.2" strokeLinejoin="round" /></svg>
    <div style={{ fontFamily: "'Space Grotesk', system-ui", fontWeight: 800, fontSize: 19, letterSpacing: -0.5, color: c }}>Tarmoto</div>
  </div>;
}

function RailSeg({ options, value, onChange, dark }) {
  return <div style={{ display: 'inline-flex', gap: 3, padding: 3, borderRadius: 11, background: dark ? 'rgba(255,255,255,0.06)' : 'rgba(14,14,16,0.05)', border: '1px solid ' + (dark ? 'rgba(255,255,255,0.08)' : 'rgba(14,14,16,0.08)') }}>
    {options.map(o => {
      const on = value === o.v;
      return <button key={o.v} onClick={() => onChange(o.v)} style={{
        padding: '7px 13px', borderRadius: 8, border: 'none', cursor: 'pointer',
        fontFamily: "'Space Grotesk', system-ui", fontWeight: 700, fontSize: 12.5,
        background: on ? (dark ? '#F3EEE6' : '#0E0E10') : 'transparent',
        color: on ? (dark ? '#0E0E10' : '#F5EFE6') : (dark ? 'rgba(243,238,230,0.65)' : 'rgba(14,14,16,0.55)'),
        transition: 'all 140ms',
      }}>{o.l}</button>;
    })}
  </div>;
}

function PhoneScene({ name, cfg, handlers, scale = 1, interactive = true, tab, onTab, onStart }) {
  const t = useT();
  const immersive = name === 'ride' || name === 'crash';
  const frameDark = immersive ? true : t.dark;
  let screen;
  if (name === 'home') screen = <HomeScreen cfg={cfg} onStart={handlers.start} onOpenRide={handlers.start} />;
  else if (name === 'roads') screen = <ExplorerScreen cfg={cfg} />;
  else if (name === 'ride') screen = <RideScreen cfg={cfg} onReport={handlers.report} onEnd={handlers.end} />;
  else if (name === 'hazard') screen = <HazardScreen onBack={handlers.toRide} onSubmit={handlers.toRide} />;
  else if (name === 'crash') screen = <CrashScreen onCancel={handlers.toRide} />;
  else if (name === 'postride') screen = <PostRideScreen onDone={handlers.home} onShare={handlers.home} />;
  else if (name === 'plan') screen = interactive ? <PlannerScreen cfg={cfg} onStart={handlers.start} /> : <QuickPlanScreen embedded onGenerate={() => { }} />;
  else if (name === 'route') screen = <RouteResultScreen cfg={cfg} embedded onBack={() => { }} onStart={handlers.start} onShuffle />;
  else if (name === 'me') screen = <ProfileScreen cfg={cfg} onSettings={handlers.settings} />;
  else if (name === 'auth') screen = <AuthScreen cfg={cfg} initial="welcome" onAuthed={handlers.home} />;
  else if (name === 'signup') screen = <AuthScreen cfg={cfg} initial="signup" onAuthed={handlers.home} />;
  else if (name === 'settings') screen = <SettingsScreen cfg={cfg} onBack={handlers.me} />;

  const showNav = SCENES.find(s => s.id === name)?.nav;
  return <Phone onDark={frameDark} scale={scale}>
    {screen}
    {showNav && <NavBar style={cfg.navStyle} active={tab} onDark={t.dark}
      onTab={interactive ? onTab : () => { }} onStart={interactive ? onStart : () => { }} />}
    <HomeIndicator onDark={frameDark} />
  </Phone>;
}

function App() {
  const [tw, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const cfg = tw;
  const tokens = React.useMemo(() => resolveTokens(cfg), [cfg.direction, cfg.theme, cfg.orient]);
  const [mode, setMode] = React.useState('proto');
  const [tab, setTab] = React.useState('home');
  const [overlay, setOverlay] = React.useState(null);
  const dark = tokens.dark;

  const setDirection = (v) => {
    // sensible default theme per direction; user can still flip
    setTweak({ direction: v, theme: v === 'onyx' ? 'dark' : 'light' });
  };

  const handlers = {
    start: () => setOverlay('ride'),
    report: () => setOverlay('hazard'),
    end: () => setOverlay('postride'),
    toRide: () => setOverlay('ride'),
    home: () => { setOverlay(null); setTab('home'); },
    settings: () => setOverlay('settings'),
    me: () => { setOverlay(null); setTab('me'); },
  };
  const onTab = (id) => { setOverlay(null); setTab(id); };
  const current = overlay || tab;

  const stageBg = dark ? '#0E0F12' : '#E4DBCC';
  const railBg = dark ? 'rgba(18,19,23,0.9)' : 'rgba(245,239,230,0.92)';
  const railLine = dark ? 'rgba(243,238,230,0.1)' : 'rgba(14,14,16,0.1)';

  const scenarios = [
    { id: 'auth', label: 'Sign in', ic: 'user' },
    { id: 'ride', label: 'Ride mode', ic: 'nav' },
    { id: 'hazard', label: 'Report', ic: 'alert' },
    { id: 'crash', label: 'Crash', ic: 'heart' },
    { id: 'postride', label: 'Summary', ic: 'flag' },
    { id: 'settings', label: 'Settings', ic: 'settings' },
  ];

  return <TokenCtx.Provider value={tokens}>
    <div style={{ minHeight: '100vh', background: stageBg, display: 'flex', flexDirection: 'column' }}>
      {/* control rail */}
      <div style={{
        position: 'sticky', top: 0, zIndex: 50, background: railBg, backdropFilter: 'blur(20px)', WebkitBackdropFilter: 'blur(20px)',
        borderBottom: '1px solid ' + railLine, padding: '14px 22px',
        display: 'flex', alignItems: 'center', gap: 18, flexWrap: 'wrap',
      }}>
        <Wordmark dark={dark} />
        <div style={{ width: 1, height: 26, background: railLine }} />
        <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
          <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 9.5, fontWeight: 700, letterSpacing: 1.2, textTransform: 'uppercase', color: dark ? 'rgba(243,238,230,0.45)' : 'rgba(14,14,16,0.42)' }}>Look</span>
          <RailSeg dark={dark} value={cfg.direction} onChange={setDirection}
            options={[{ v: 'atlas', l: 'Atlas' }, { v: 'onyx', l: 'Onyx' }, { v: 'rally', l: 'Rally' }]} />
        </div>
        <button onClick={() => setTweak('theme', dark ? 'light' : 'dark')} title="Toggle theme" style={{
          width: 38, height: 38, borderRadius: 10, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center',
          border: '1px solid ' + railLine, background: dark ? 'rgba(255,255,255,0.06)' : 'rgba(14,14,16,0.04)', color: dark ? '#F3EEE6' : '#0E0E10',
        }}><Icon name={dark ? 'sun' : 'moon'} size={19} /></button>
        <button onClick={() => setTweak('orient', cfg.orient === 'landscape' ? 'portrait' : 'landscape')} title="Rotate device" style={{
          width: 38, height: 38, borderRadius: 10, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center',
          border: '1px solid ' + railLine, background: cfg.orient === 'landscape' ? '#FF6A1A' : (dark ? 'rgba(255,255,255,0.06)' : 'rgba(14,14,16,0.04)'),
          color: cfg.orient === 'landscape' ? '#0E0E10' : (dark ? '#F3EEE6' : '#0E0E10'),
        }}><Icon name="phone" size={19} style={{ transform: cfg.orient === 'landscape' ? 'rotate(90deg)' : 'none' }} /></button>

        <div style={{ flex: 1 }} />

        <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 9.5, color: dark ? 'rgba(243,238,230,0.4)' : 'rgba(14,14,16,0.4)', letterSpacing: 0.5, maxWidth: 190, lineHeight: 1.4, display: 'none' }} className="rail-hint">
          Open Tweaks for map · home · nav
        </span>
        <RailSeg dark={dark} value={mode} onChange={setMode}
          options={[{ v: 'proto', l: 'Prototype' }, { v: 'gallery', l: 'Gallery' }]} />
      </div>

      {/* scenario quick-launch (proto only) */}
      {mode === 'proto' && <div style={{ display: 'flex', justifyContent: 'center', gap: 8, padding: '14px 22px 2px', flexWrap: 'wrap' }}>
        {scenarios.map(s => {
          const on = overlay === s.id;
          return <button key={s.id} onClick={() => setOverlay(s.id)} style={{
            display: 'inline-flex', alignItems: 'center', gap: 7, padding: '8px 14px', borderRadius: 999, cursor: 'pointer',
            fontFamily: "'Space Grotesk', system-ui", fontWeight: 700, fontSize: 12.5,
            border: '1px solid ' + (on ? 'transparent' : railLine),
            background: on ? '#FF6A1A' : (dark ? 'rgba(255,255,255,0.05)' : 'rgba(255,255,255,0.5)'),
            color: on ? '#0E0E10' : (dark ? '#F3EEE6' : '#0E0E10'),
          }}><Icon name={s.ic} size={15} color={on ? '#0E0E10' : (dark ? '#F3EEE6' : '#0E0E10')} /> {s.label}</button>;
        })}
        {overlay && <button onClick={() => setOverlay(null)} style={{
          display: 'inline-flex', alignItems: 'center', gap: 6, padding: '8px 14px', borderRadius: 999, cursor: 'pointer',
          fontFamily: "'Space Grotesk', system-ui", fontWeight: 700, fontSize: 12.5, border: '1px solid ' + railLine,
          background: 'transparent', color: dark ? 'rgba(243,238,230,0.6)' : 'rgba(14,14,16,0.55)',
        }}><Icon name="close" size={14} color={dark ? 'rgba(243,238,230,0.6)' : 'rgba(14,14,16,0.55)'} /> Exit</button>}
      </div>}

      {/* stage */}
      {mode === 'proto'
        ? <div style={{ flex: 1, display: 'flex', justifyContent: 'center', alignItems: 'flex-start', padding: '28px 20px 60px' }}>
          <PhoneScene name={current} cfg={cfg} handlers={handlers} tab={tab} onTab={onTab} onStart={handlers.start} />
        </div>
        : <div style={{ flex: 1, padding: '30px 28px 80px' }}>
          <div style={{ display: 'grid', gridTemplateColumns: `repeat(auto-fill, minmax(${cfg.orient === 'landscape' ? 366 : 258}px, 1fr))`, gap: '36px 24px', maxWidth: 1280, margin: '0 auto', justifyItems: 'center' }}>
            {SCENES.map(sc => (
              <div key={sc.id} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 14 }}>
                <PhoneScene name={sc.id} cfg={cfg} handlers={handlers} tab={navTabFor(sc.id)} interactive={false} scale={cfg.orient === 'landscape' ? 0.42 : 0.62} />
                <div style={{ textAlign: 'center' }}>
                  <div style={{ fontFamily: "'Space Grotesk', system-ui", fontWeight: 800, fontSize: 14, color: dark ? '#F3EEE6' : '#0E0E10' }}>{sc.label}</div>
                </div>
              </div>
            ))}
          </div>
        </div>}

      {/* Tweaks */}
      <TweaksPanel title="Tweaks">
        <TweakSection label="Look & feel" />
        <TweakRadio label="Direction" value={cfg.direction} options={['atlas', 'onyx', 'rally']} onChange={setDirection} />
        <TweakRadio label="Theme" value={cfg.theme} options={['light', 'dark']} onChange={(v) => setTweak('theme', v)} />
        <TweakSection label="Map & layout" />
        <TweakRadio label="Map style" value={cfg.mapStyle} options={['light', 'dark']} onChange={(v) => setTweak('mapStyle', v)} />
        <TweakRadio label="Home" value={cfg.homeLayout} options={['map', 'list']} onChange={(v) => setTweak('homeLayout', v)} />
        <TweakRadio label="Bottom nav" value={cfg.navStyle} options={['bar', 'dock', 'float']} onChange={(v) => setTweak('navStyle', v)} />
        <TweakRadio label="Orientation" value={cfg.orient} options={['portrait', 'landscape']} onChange={(v) => setTweak('orient', v)} />
      </TweaksPanel>
    </div>
  </TokenCtx.Provider>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
</html>
