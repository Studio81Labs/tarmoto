-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" role="img" aria-label="Tarmoto wordmark">
  <title>Tarmoto wordmark</title>
  <g transform="translate(10 16)">
    <rect x="0" y="0" width="48" height="48" rx="10" fill="#FF6A1A"/>
    <g transform="translate(4 4)">
