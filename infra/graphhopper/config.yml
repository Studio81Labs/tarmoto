# GraphHopper config for the self-hosted Tarmoto routing engine (ADR-0004).
#
# This is a STARTING TEMPLATE for the pinned image tag in the compose service
# (israelhikingmap/graphhopper:10.2). The Tarmoto-specific requirement is the
# set of `graph.encoded_values` below — keep `road_class` and `toll` (and
# ideally `surface`) so the backend's request-time custom models work:
#   - avoid_highways → needs `road_class`
#   - avoid_tolls    → needs `toll`   (else the rule is silently dropped; see
#                      TARMOTO_GRAPHHOPPER_TOLL_ENABLED in the README)
#   - future road-quality / curvy weighting → will use `surface` + an
#                      imported custom encoded value (the moat work, ADR-0004)
#
# `datareader.file` (input OSM) is set below as a DEPLOY DEFAULT. The deployed
# Coolify image (infra/graphhopper/Dockerfile) runs the stock entrypoint
# `graphhopper.sh -c config-example.yml` with NO `-i`, and that script only sets
# datareader.file from `-i` — so without this the container aborts with
# "If no graph.location is provided you need to specify an OSM file." Local dev +
# start.sh still pass `-i`, which overrides this.
#
# `graph.location` is deliberately NOT set here: the image's `graphhopper.sh`
# ALWAYS forces it to its `GRAPH` default `/data/default-gh` when no `-o` is given
# (it passes `-Ddw.graphhopper.graph.location` unconditionally), so a value here
# is silently ignored. The deployed graph therefore lives at `/data/default-gh` —
# which is what start.sh and the runbook clear to force a re-import. (Local dev
# passes `-o`, so the graph is at the compose `-o` path there.)
#
# Config schema changes between GraphHopper majors — if the container fails to
# start after a version bump, diff this against the `config-example.yml` shipped
# with the new image tag.
graphhopper:
  # Deploy default (overridden by `-i` locally): the conflation output on the
  # shared /data volume.
  datareader.file: /data/routing/cz.quality.osm

  # Encoded values exposed to custom models. `car_access` + `car_average_speed`
  # power the base car weighting (below); the rest are what Tarmoto's
  # avoidances + weighting reference. `smoothness` carries our conflated road
  # quality (ADR-0005): the conflation job injects an OSM `smoothness` tag from
  # `road_segments`, and the backend's preferQuality custom_model weights it
  # (TARMOTO_GRAPHHOPPER_QUALITY_ENABLED).
  graph.encoded_values: car_access, car_average_speed, road_class, road_environment, max_speed, toll, surface, smoothness, road_access

  profiles:
    - name: car
      # Inlined minimal car model so the profile is self-contained (a custom
      # profile MUST define a `speed` block, and supply the car access rule).
      # The backend's request-time custom_model is merged on top of this.
      custom_model:
        distance_influence: 70
        priority:
          - if: "!car_access"
            multiply_by: "0"
        speed:
          - if: "true"
            limit_to: "car_average_speed"

  # Speed mode (Contraction Hierarchies) for the car profile → fast plain
  # routes, and `algorithm=alternative_route` works WITHOUT `ch.disable`
  # (the filter-less commute/trip path). Custom-model requests arrive with
  # `ch.disable: true` and are served in flexible mode.
  profiles_ch:
    - profile: car

  # Hybrid (Landmarks) keeps flexible / custom-model queries fast.
  profiles_lm:
    - profile: car

  import.osm.ignored_highways: footway,cycleway,path,pedestrian,steps,bridleway

# Bind to all interfaces so the host (and the backend container) can reach it.
server:
  application_connectors:
    - type: http
      port: 8989
      bind_host: 0.0.0.0
  admin_connectors:
    - type: http
      port: 8990
      bind_host: 0.0.0.0
