name: tarmoto-dev

services:
  postgres:
    container_name: tarmoto-db
    image: postgis/postgis:17-3.4-alpine
    restart: unless-stopped
    # Default host port is 5433 (not 5432) to avoid clashing with any
    # system-local PostgreSQL on the same Docker host. Override with
    # TARMOTO_DATABASE_PORT if 5433 is also taken.
    ports:
      - "${TARMOTO_DATABASE_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tarmoto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tarmoto}
      POSTGRES_DB: ${POSTGRES_DB:-tarmoto}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tarmoto}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    container_name: tarmoto-redis
    image: redis:8-alpine
    restart: unless-stopped
    # Default host port is 6380 (not 6379) to avoid clashing with any
    # system-local Redis or another dev container on 6379.
    ports:
      - "${TARMOTO_REDIS_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # S3-compatible storage for testing the `s3` storage driver
  # locally. Off by default so the standard `pnpm db:up` flow stays
  # cheap; opt in with `pnpm db:up --profile s3` (or
  # `docker compose --profile s3 up -d`) when iterating on avatar /
  # review-photo / data-export storage. Once running, point the
  # backend at it with:
  #
  #   TARMOTO_STORAGE_DRIVER=s3
  #   TARMOTO_S3_BUCKET=tarmoto
  #   TARMOTO_S3_REGION=us-east-1
  #   TARMOTO_S3_ENDPOINT=http://localhost:9000
  #   TARMOTO_S3_ACCESS_KEY_ID=minioadmin
  #   TARMOTO_S3_SECRET_ACCESS_KEY=minioadmin
  #   TARMOTO_S3_FORCE_PATH_STYLE=true
  #
  # The console (default port 9001) is the easy way to create the
  # `tarmoto` bucket on first run. See `docs/process/runbook.md` for
  # the production setup.
  minio:
    container_name: tarmoto-minio
    image: minio/minio:latest
    profiles: ["s3"]
    restart: unless-stopped
    ports:
      - "${TARMOTO_S3_PORT:-9000}:9000"
      - "${TARMOTO_S3_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${TARMOTO_S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${TARMOTO_S3_SECRET_ACCESS_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  valhalla:
    container_name: tarmoto-valhalla
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
    ports:
      - "8002:8002"
    volumes:
      - ../valhalla/custom_files:/custom_files
    environment:
      # First start downloads this extract + builds tiles into the volume;
      # later starts reuse them automatically (the image stores the pbf hash
      # and skips the rebuild when the data is unchanged).
      tile_urls: https://download.geofabrik.de/europe/czech-republic-latest.osm.pbf
      # Must be False so the FIRST run actually builds tiles from the pbf.
      # (True = "ignore the pbf, load existing tiles" — which crash-loops on an
      # empty volume because there are no tiles yet.)
      use_tiles_ignore_pbf: "False"
      build_elevation: "False"
      build_admins: "True"
      build_time_zones: "False"
      server_threads: "2"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
