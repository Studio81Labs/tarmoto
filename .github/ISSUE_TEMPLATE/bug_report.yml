name: Bug Report
description: Report a bug or unexpected behavior
labels: ["type:bugfix"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug clearly.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Go to ...
        2. Tap on ...
        3. See error
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Mobile app
        - Backend API
        - Maps / Tiles
        - Trip planner
        - Ride tracking
        - Hazard reporting
        - Other
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device / Environment
      placeholder: "iPhone 15, iOS 18 / Pixel 8, Android 15 / Browser"
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste any relevant logs or attach screenshots.
