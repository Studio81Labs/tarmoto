name: Packages CI

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "apps/backend/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/packages-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/**"
      - "apps/backend/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/packages-ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test & typecheck packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # @tarmoto/openapi's tests regenerate the Postman collection from
      # packages/openapi/openapi.yaml, which is produced by the backend export
      # (tarmoto has no postinstall codegen — see N2 in the alignment notes).
      # openapi:gen builds @tarmoto/shared, exports the spec, and regenerates
      # the TS client; the export self-defaults all DB/Redis/JWT env, so no
      # secrets are needed.
      - name: Generate OpenAPI spec + client
        run: pnpm openapi:gen

      - name: Build packages
        run: pnpm --filter "./packages/*" run build

      - name: Test packages
        run: pnpm --filter "./packages/*" run test

      - name: Typecheck packages
        run: pnpm --filter "./packages/*" run typecheck
