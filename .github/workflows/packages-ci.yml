name: Packages CI

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "apps/backend/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/packages-ci.yml"
      - ".github/workflows/_build-openapi.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/**"
      - "apps/backend/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/packages-ci.yml"
      - ".github/workflows/_build-openapi.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Build the OpenAPI spec once (reusable workflow) and fan it out as an
  # artifact, instead of rebuilding the backend inline here.
  prepare-openapi:
    uses: ./.github/workflows/_build-openapi.yml

  build:
    name: Build, test & typecheck packages
    needs: prepare-openapi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download generated OpenAPI spec
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: openapi-spec
          path: ${{ runner.temp }}

      - name: Restore generated OpenAPI spec
        run: |
          mkdir -p packages/openapi
          tar -xzf "$RUNNER_TEMP/openapi-spec.tgz" -C packages/openapi

      # @tarmoto/openapi's tests regenerate the Postman collection from the
      # restored openapi.yaml, and openapi-client's typecheck/test need the
      # generated schema.d.ts — produce it from the spec above.
      - name: Generate OpenAPI client
        run: pnpm --filter @tarmoto/openapi-client generate

      - name: Build packages
        run: pnpm --filter "./packages/*" run build

      - name: Test packages
        run: pnpm --filter "./packages/*" run test

      - name: Typecheck packages
        run: pnpm --filter "./packages/*" run typecheck
