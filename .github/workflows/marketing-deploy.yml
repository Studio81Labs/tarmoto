name: Marketing Deploy

# Deploys the Astro marketing/landing site to Cloudflare Pages and the
# waitlist Worker on push to main.

on:
  push:
    branches: [main]
    paths:
      - "apps/marketing/**"
      - "packages/brand/**"
      - ".github/workflows/marketing-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketing-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy marketing site + waitlist worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build marketing site
        env:
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL || 'https://tarmoto-waitlist.studio81.workers.dev' }}
        run: pnpm marketing:build

      - name: Deploy marketing site to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/marketing/dist --project-name=tarmoto-website

      - name: Deploy waitlist worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/marketing/worker
          command: deploy
