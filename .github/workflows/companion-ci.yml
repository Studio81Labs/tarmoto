name: Companion CI

on:
  push:
    branches: [main]
    paths:
      - "apps/companion/**"
      - "apps/backend/**"
      - "packages/shared/**"
      - "packages/ui/**"
      - "packages/openapi/**"
      - "scripts/eslint/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/companion-ci.yml"
      - ".github/workflows/_build-openapi.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/companion/**"
      - "apps/backend/**"
      - "packages/shared/**"
      - "packages/ui/**"
      - "packages/openapi/**"
      - "scripts/eslint/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/companion-ci.yml"
      - ".github/workflows/_build-openapi.yml"

permissions:
  contents: read

concurrency:
  # PRs group by PR number so a new push supersedes the run before it. Pushes
  # group by commit SHA so every commit on main gets its own group and is
  # validated on its own.
  #
  # The SHA matters. With `github.ref` there is one group for the whole branch,
  # so merges cancel each other and commits landing in quick succession are
  # never validated. That happened to nexcue on 2026-08-06: the merge commit
  # for their #676 finished with zero check-runs while a later commit had
  # fifteen.
  #
  # `cancel-in-progress: false` does *not* fix that on its own. GitHub keeps
  # only one pending run per group — a newly queued run cancels the previously
  # pending one whatever this flag says — so with three merges in flight the
  # middle commit is still dropped. Only a per-commit group covers every one.
  #
  # Worth knowing when reading history: a cancelled run reports as *failed*, so
  # the symptom looks like a broken branch rather than an unverified one.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # Build the OpenAPI spec once (reusable workflow) and fan it out as an
  # artifact, instead of rebuilding the backend inline here.
  prepare-openapi:
    name: "contract: openapi spec"
    uses: ./.github/workflows/_build-openapi.yml

  build:
    name: "companion: lint, typecheck, test & build"
    needs: prepare-openapi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm shared:build

      - name: Download generated OpenAPI spec
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: openapi-spec
          path: ${{ runner.temp }}

      - name: Restore generated OpenAPI spec
        run: |
          mkdir -p packages/openapi
          tar -xzf "$RUNNER_TEMP/openapi-spec.tgz" -C packages/openapi

      # Companion imports @tarmoto/openapi-client, whose generated schema.d.ts
      # is produced from the spec above (both are gitignored).
      - name: Generate OpenAPI client
        run: pnpm --filter @tarmoto/openapi-client generate

      - name: Lint
        run: pnpm --filter @tarmoto/companion lint

      - name: Typecheck
        run: pnpm --filter @tarmoto/companion typecheck

      - name: Test
        run: pnpm --filter @tarmoto/companion test

      - name: Build
        run: pnpm --filter @tarmoto/companion build

      # Boots the exact bundle Coolify runs. Ported from tabletap's pwa-ci:
      # their standalone container once died on boot with a missing
      # @swc/helpers ESM module while every page still returned 200 from the
      # old build — the assertion that catches that class is the LOG grep,
      # not the status codes, which is why both are here.
      - name: Smoke-boot the standalone bundle
        run: |
          set -euo pipefail
          test -f apps/companion/.next/standalone/apps/companion/server.js || {
            echo "::error::next build did not emit the standalone server — check output: 'standalone' in next.config.ts"
            exit 1
          }
          cd apps/companion/.next/standalone
          PORT=3999 HOSTNAME=127.0.0.1 node apps/companion/server.js > "$RUNNER_TEMP/standalone.log" 2>&1 &
          SERVER_PID=$!
          for attempt in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:3999/health; then echo "healthy after ${attempt}s"; break; fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "::error::standalone server exited during boot"
              cat "$RUNNER_TEMP/standalone.log"
              exit 1
            fi
            sleep 1
          done
          for path in /health /explore /login; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3999${path}" || echo '000')
            echo "GET ${path} -> ${CODE}"
            [ "$CODE" = "200" ] || { echo "::error::standalone ${path} returned ${CODE}"; kill "$SERVER_PID"; exit 1; }
          done
          kill "$SERVER_PID"
          if grep -qE "Cannot find module|MODULE_NOT_FOUND" "$RUNNER_TEMP/standalone.log"; then
            echo "::error::standalone server logged a module resolution failure:"
            grep -E "Cannot find module|MODULE_NOT_FOUND" "$RUNNER_TEMP/standalone.log" | head -5
            exit 1
          fi
          echo "standalone bundle boots clean"
