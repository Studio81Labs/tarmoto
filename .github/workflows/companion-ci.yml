name: Companion CI

on:
  push:
    branches: [main]
    paths:
      - "apps/companion/**"
      - "packages/shared/**"
      - "packages/openapi/**"
      - ".github/workflows/companion-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/companion/**"
      - "packages/shared/**"
      - "packages/openapi/**"
      - ".github/workflows/companion-ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm build:shared

      # ESLint 9 flat config lives at apps/companion/eslint.config.mjs.
      # Re-enabled now that it exists.

      - name: Lint
        run: pnpm --filter @tarmoto/companion lint

      - name: Typecheck
        run: pnpm --filter @tarmoto/companion typecheck

      - name: Test
        run: pnpm --filter @tarmoto/companion test

      - name: Build
        run: pnpm --filter @tarmoto/companion build
