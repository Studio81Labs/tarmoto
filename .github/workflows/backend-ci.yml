name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - "packages/shared/**"
      - "packages/ingest/**"
      - "packages/poi-db/**"
      - "packages/openapi/**"
      - "tsconfig.base.json"
      # The EXECUTED baseline: InitSchema1713 runs this file as the first migration, so a
      # change to it is a schema change. Without it here, a PR touching only this file skips
      # the very job that exists to catch baseline drift — which is precisely how #1193 got
      # in and stayed in.
      - "docs/database/schema.sql"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/backend/**"
      - "packages/shared/**"
      - "packages/ingest/**"
      - "packages/poi-db/**"
      - "packages/openapi/**"
      - "tsconfig.base.json"
      # The EXECUTED baseline: InitSchema1713 runs this file as the first migration, so a
      # change to it is a schema change. Without it here, a PR touching only this file skips
      # the very job that exists to catch baseline drift — which is precisely how #1193 got
      # in and stayed in.
      - "docs/database/schema.sql"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

concurrency:
  # PRs group by PR number so a new push supersedes the run before it. Pushes
  # group by commit SHA so every commit on main gets its own group and is
  # validated on its own.
  #
  # The SHA matters. With `github.ref` there is one group for the whole branch,
  # so merges cancel each other and commits landing in quick succession are
  # never validated. That happened to nexcue on 2026-08-06: the merge commit
  # for their #676 finished with zero check-runs while a later commit had
  # fifteen.
  #
  # `cancel-in-progress: false` does *not* fix that on its own. GitHub keeps
  # only one pending run per group — a newly queued run cancels the previously
  # pending one whatever this flag says — so with three merges in flight the
  # middle commit is still dropped. Only a per-commit group covers every one.
  #
  # Worth knowing when reading history: a cancelled run reports as *failed*, so
  # the symptom looks like a broken branch rather than an unverified one.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: "backend: typecheck, test & build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm shared:build

      - name: Generate OpenAPI client
        run: pnpm openapi:gen

      - name: Build backend
        run: pnpm backend:build

      - name: Lint backend
        run: pnpm --filter @tarmoto/backend lint

      # The root tsconfig includes every spec/e2e-spec file — `nest build`
      # (tsconfig.build.json) checks only src/, so without this step no test
      # code is typechecked anywhere. 649 errors had accumulated there
      # unnoticed (#1246); the siblings gate the same way.
      - name: Typecheck backend
        run: pnpm backend:typecheck

      - name: Test backend
        run: pnpm --filter @tarmoto/backend test

  schema:
    # The display name deliberately stays "schema from zero" although the job now ALSO
    # proves writer SQL behaviour: the name is this job's identity in required-check
    # configuration and the sibling drift comparison, and "from zero (real postgres)" is
    # still the claim that distinguishes it — everything it runs executes against a
    # database built from the empty migration chain. The comment below carries the full
    # claim; renaming would orphan the required check for a wording nuance.
    name: "backend: schema from zero (real postgres)"
    runs-on: ubuntu-latest
    # Builds the database FROM ZERO and then runs the store-chains suites. Three things are
    # asserted: that the migration chain is self-contained (nothing else in CI checks this —
    # see #1193), that migration 1837's CHECK constraints and partial unique indexes hold,
    # and that the chain writers' SQL (rollup maintenance, overlap-pair `ON CONFLICT`
    # dedup, the sweeps — #1191 items 2 and 4) behaves against real constraints. The
    # ordinary backend job runs Jest with `rootDir: "src"`, so nothing under `test/` is
    # collected there, and it provisions no database.
    #
    # Scoped to the `store-subscription-chains*` suites, the trip-planning guard spec, and
    # the clear-launch-mode-overrides migration spec, rather than all of `test:e2e`: the
    # other specs expect a seeded database, the POI service and a booted app, so they would
    # fail for reasons unrelated to what this job exists to check. The trip-planning guard
    # spec (#1164) is deliberately self-contained — it boots only DatabaseModule +
    # AuthModule + TripsModule and seeds its own rider and kill-switch row — and the
    # clear-launch-mode-overrides spec (#1104) needs only a raw `DataSource` — so the
    # from-zero database this job builds is exactly what both need.
    services:
      postgres:
        # PostGIS, not plain Postgres — the schema uses native geometry columns.
        # Tag AND digest: the digest is what runs (a mutable tag can be
        # repointed under a green CI history); the tag is what Renovate follows
        # to propose the next release.
        image: postgis/postgis:17-3.4-alpine@sha256:5a1dbedac34e0e6663f8b7190d393339571f1cb3ecb2ab2f724524b4f3c7956e
        env:
          POSTGRES_USER: tarmoto
          POSTGRES_PASSWORD: tarmoto
          POSTGRES_DB: tarmoto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tarmoto"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TARMOTO_DATABASE_HOST: localhost
      TARMOTO_DATABASE_PORT: 5432
      TARMOTO_DATABASE_NAME: tarmoto
      TARMOTO_DATABASE_USER: tarmoto
      TARMOTO_DATABASE_PASSWORD: tarmoto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # db:migrate builds ingest, poi-db and backend, and all three import @tarmoto/shared
      # from its build output — without this the job dies at `tsc` before reaching a database.
      - name: Build shared package
        run: pnpm shared:build

      - name: Run migrations on an EMPTY database
        run: pnpm db:migrate

      - name: Schema tests
        run: pnpm --filter @tarmoto/backend test:e2e -- store-subscription-chains

      # HTTP-level proof that the `trip_planning` operator kill switch blocks the
      # trip-creation endpoints (403 FeatureForbiddenDto) while reads and edits of
      # existing trips stay open (#1164). Self-contained on the from-zero database
      # this job just built — no seed, no Redis, no POI service.
      - name: Trip-planning guard e2e
        run: pnpm --filter @tarmoto/backend test:e2e -- trip-planning-create-guard

      # Proves migration 1839 (#1104) discriminates an untouched launch seed
      # (deleted) from an operator-modified row sharing the same feature key
      # (preserved) — a distinction the migration's own mocked-queryRunner
      # unit spec cannot exercise, since a text-matched fake query never
      # evaluates a WHERE clause against real rows. Self-contained on the
      # from-zero database this job just built.
      - name: Clear-launch-mode-overrides migration e2e
        run: pnpm --filter @tarmoto/backend test:e2e -- clear-launch-mode-overrides-migration
