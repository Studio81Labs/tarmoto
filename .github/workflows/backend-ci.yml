name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - "packages/shared/**"
      - "packages/ingest/**"
      - "packages/poi-db/**"
      - "packages/openapi/**"
      - "tsconfig.base.json"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/backend/**"
      - "packages/shared/**"
      - "packages/ingest/**"
      - "packages/poi-db/**"
      - "packages/openapi/**"
      - "tsconfig.base.json"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm shared:build

      - name: Generate OpenAPI client
        run: pnpm openapi:gen

      - name: Build backend
        run: pnpm backend:build

      - name: Lint backend
        run: pnpm --filter @tarmoto/backend lint

      - name: Test backend
        run: pnpm --filter @tarmoto/backend test

  schema:
    name: Schema (real Postgres)
    runs-on: ubuntu-latest
    # The job above runs Jest with `rootDir: "src"`, so nothing under `test/` is collected,
    # and it provisions no database. CHECK predicates and partial unique indexes are only
    # evaluated by a real server, so without this a malformed constraint merges with fully
    # green CI — which is how the Apple index defect reached review. See #1191 / #1193.
    #
    # Scoped to the schema suite rather than all of `test:e2e`: the other specs there expect
    # a seeded database, the POI service and a booted app, and dragging them in would make
    # this job fail for reasons that have nothing to do with the schema it exists to check.
    services:
      postgres:
        # PostGIS, not plain Postgres — the schema uses native geometry columns.
        image: postgis/postgis:17-3.4-alpine
        env:
          POSTGRES_USER: tarmoto
          POSTGRES_PASSWORD: tarmoto
          POSTGRES_DB: tarmoto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tarmoto"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TARMOTO_DATABASE_HOST: localhost
      TARMOTO_DATABASE_PORT: 5432
      TARMOTO_DATABASE_NAME: tarmoto
      TARMOTO_DATABASE_USER: tarmoto
      TARMOTO_DATABASE_PASSWORD: tarmoto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run migrations on an EMPTY database
        # Building the schema from zero is itself the assertion: it is the only thing that
        # proves the chain is self-contained, which nothing else in CI checks.
        run: pnpm db:migrate

      - name: Schema tests
        run: pnpm --filter @tarmoto/backend test:e2e -- store-subscription-chains-schema
