name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - "packages/shared/**"
      - "packages/ingest/**"
      - "packages/poi-db/**"
      - "packages/openapi/**"
      - "tsconfig.base.json"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/backend/**"
      - "packages/shared/**"
      - "packages/ingest/**"
      - "packages/poi-db/**"
      - "packages/openapi/**"
      - "tsconfig.base.json"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm shared:build

      - name: Generate OpenAPI client
        run: pnpm openapi:gen

      - name: Build backend
        run: pnpm backend:build

      - name: Lint backend
        run: pnpm --filter @tarmoto/backend lint

      - name: Test backend
        run: pnpm --filter @tarmoto/backend test

  e2e:
    name: E2E (real Postgres)
    runs-on: ubuntu-latest
    # Ordinary Jest has `rootDir: "src"`, so every spec under `test/` is invisible to the
    # `Test backend` job above — including the migration's own schema regressions. CHECK
    # predicates and partial unique indexes are only evaluated by a real database, so
    # without this job a malformed constraint merges with fully green CI. See #1191.
    services:
      postgres:
        # PostGIS, not plain Postgres: the schema uses native geometry columns.
        image: postgis/postgis:17-3.4-alpine
        env:
          POSTGRES_USER: tarmoto
          POSTGRES_PASSWORD: tarmoto
          POSTGRES_DB: tarmoto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tarmoto"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TARMOTO_DATABASE_HOST: localhost
      TARMOTO_DATABASE_PORT: 5432
      TARMOTO_DATABASE_NAME: tarmoto
      TARMOTO_DATABASE_USER: tarmoto
      TARMOTO_DATABASE_PASSWORD: tarmoto
      TARMOTO_REDIS_HOST: localhost
      TARMOTO_REDIS_PORT: 6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm shared:build

      - name: Run migrations
        run: pnpm db:migrate

      - name: E2E tests
        run: pnpm --filter @tarmoto/backend test:e2e
