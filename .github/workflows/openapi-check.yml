name: OpenAPI Check

on:
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - "packages/shared/**"
      - "packages/openapi/**"
      - "packages/openapi-client/**"
      - "tsconfig.base.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/openapi-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/backend/**"
      - "packages/shared/**"
      - "packages/openapi/**"
      - "packages/openapi-client/**"
      - "tsconfig.base.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/openapi-check.yml"

permissions:
  contents: read

concurrency:
  # PRs group by PR number so a new push supersedes the run before it. Pushes
  # group by commit SHA so every commit on main gets its own group and is
  # validated on its own.
  #
  # The SHA matters. With `github.ref` there is one group for the whole branch,
  # so merges cancel each other and commits landing in quick succession are
  # never validated. That happened to nexcue on 2026-08-06: the merge commit
  # for their #676 finished with zero check-runs while a later commit had
  # fifteen.
  #
  # `cancel-in-progress: false` does *not* fix that on its own. GitHub keeps
  # only one pending run per group — a newly queued run cancels the previously
  # pending one whatever this flag says — so with three merges in flight the
  # middle commit is still dropped. Only a per-commit group covers every one.
  #
  # Worth knowing when reading history: a cancelled run reports as *failed*, so
  # the symptom looks like a broken branch rather than an unverified one.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  validate:
    name: "contract: emit + validate openapi"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Codegen is not a postinstall hook, so this freshness gate regenerates
      # the contract itself: build the backend (openapi nest config) -> export
      # the spec -> regenerate the @tarmoto/openapi-client TS schema. The
      # export script self-defaults all env (DB/Redis/JWT placeholders), so no
      # secrets are needed — see apps/backend/src/scripts/export-openapi.ts.
      - name: Regenerate OpenAPI spec + client
        run: pnpm openapi:gen

      - name: Verify openapi.yaml exists and is valid
        run: |
          test -f packages/openapi/openapi.yaml
          head -1 packages/openapi/openapi.yaml | grep -E '^openapi:'

      # Structural validation of the spec itself (redocly ruleset), not just
      # the shebang line above — a malformed schema that openapi-typescript
      # happens to tolerate still breaks other consumers.
      - name: Validate OpenAPI spec
        run: pnpm openapi:validate

      - name: Verify generated TS schema exists
        run: test -f packages/openapi-client/src/generated/schema.d.ts

      # Freshness gate: the client is committed and openapi-typescript is pinned
      # (exact), so regeneration is deterministic — a diff here means a backend
      # DTO/controller change landed without regenerating the committed client.
      - name: Verify committed openapi-client is up to date
        run: |
          if ! git diff --quiet -- packages/openapi-client/src/generated/schema.d.ts; then
            echo "::error::packages/openapi-client/src/generated/schema.d.ts is stale. Run 'pnpm openapi:gen' and commit the result."
            git diff --stat -- packages/openapi-client/src/generated/schema.d.ts
            exit 1
          fi

      - name: Typecheck openapi-client
        run: pnpm -C packages/openapi-client run typecheck

      # The hand-written client surface (client.ts, index.ts, browser-safe.ts,
      # react-query.ts) sat outside every lint run until this step existed;
      # src/generated/ stays excluded in the package's eslint config.
      - name: Lint openapi-client
        run: pnpm openapi-client:lint
