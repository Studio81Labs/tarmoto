name: Backend Deploy

# Coolify auto-deploys on push to main (Dockerfile build + healthcheck
# rolling update). This workflow waits for the new container to pass its
# healthcheck, runs a smoke test, and triggers a rollback on failure.
#
# Deploy target: Hetzner CX33 + Coolify per ADR-0006.
# Day-2 ops: docs/process/runbook.md, infra/coolify/README.md
#
# Required repo secrets:
#   COOLIFY_API_TOKEN           Coolify API token (Keys & Tokens)
#   COOLIFY_APPLICATION_UUID    Application UUID from Coolify URL
#
# Required repo variables:
#   BACKEND_URL_PROD            e.g. https://api.tarmoto.app

on:
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - "packages/shared/**"
      - "packages/openapi/**"
      - "docs/database/**"
      - ".github/workflows/backend-deploy.yml"
      - "scripts/smoke/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy & verify
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v6

      - name: Wait for deploy to go live
        env:
          BASE_URL: ${{ vars.BACKEND_URL_PROD }}
        run: |
          set -euo pipefail
          # Coolify's rolling update builds the image, starts a new
          # container, and waits for the Docker HEALTHCHECK to pass
          # before switching traffic. We poll the app healthcheck
          # endpoint until it returns 200 — the new container is live.
          DEADLINE=$(( $(date +%s) + 600 ))
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' \
              "${BASE_URL}/api/v1/healthz" || echo '000')
            if [ "$CODE" = "200" ]; then
              echo "Healthcheck passed (200)"
              exit 0
            fi
            echo "Healthcheck returned ${CODE}; waiting..."
            sleep 10
          done
          echo "::error::Timed out waiting for healthy deploy"
          exit 1

      - name: Smoke test
        env:
          BASE_URL: ${{ vars.BACKEND_URL_PROD }}
        run: scripts/smoke/smoke.sh "$BASE_URL"

      - name: Roll back on smoke failure
        if: failure()
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          APPLICATION_UUID: ${{ secrets.COOLIFY_APPLICATION_UUID }}
          COOLIFY_URL: https://coolify.studio81.cz
        run: |
          set -euo pipefail
          echo "::warning::Smoke test failed — rolling back via Coolify API."

          DEPLOYS=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
            -H "Accept: application/json" \
            "${COOLIFY_URL}/api/v1/applications/${APPLICATION_UUID}")

          CURRENT=$(echo "$DEPLOYS" | jq -r '.deployments[0].id // empty')
          PREV=$(echo "$DEPLOYS" | jq -r '.deployments[1].id // empty')

          if [ -z "$PREV" ]; then
            echo "::error::No previous deployment to roll back to."
            echo "::error::Open Coolify → Deployments → Redeploy a previous successful deploy."
            exit 1
          fi

          echo "Rolling back from ${CURRENT} to ${PREV}..."
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
            -H "Accept: application/json" \
            "${COOLIFY_URL}/api/v1/applications/${APPLICATION_UUID}/deployments/${PREV}/rollback" \
            > /dev/null
          echo "::notice::Rolled back to deployment ${PREV}"
