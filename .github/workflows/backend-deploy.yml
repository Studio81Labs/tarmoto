name: Backend Deploy

# Render handles the Docker build + deploy itself, off `git push` to
# main (see infra/render/render.yaml's autoDeploy flag). This workflow
# waits for Render to finish, runs a smoke test, and triggers a
# rollback on smoke failure.
#
# There is no staging environment — `main` is prod. workflow_dispatch
# covers re-running the smoke + rollback flow against the current prod
# deploy after a manual Render redeploy.
#
# Choice rationale: docs/decisions/0005-deployment-stack-render.md
# Day-2 ops: docs/process/runbook.md
#
# Required repo secrets:
#   RENDER_API_KEY              Render account API key
#   RENDER_SERVICE_ID_PROD      `srv-...` for the prod Web Service
#
# Required repo variables:
#   BACKEND_URL_PROD            e.g. https://api.tarmoto.app

on:
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - "packages/shared/**"
      - "packages/openapi/**"
      - "infra/render/**"
      - ".github/workflows/backend-deploy.yml"
      - "scripts/smoke/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy & verify
    runs-on: ubuntu-latest

    # The `production` GitHub environment enforces required reviewers
    # / branch protections configured in the repo settings.
    environment: production

    steps:
      - uses: actions/checkout@v6

      - name: Wait for deploy to go live
        id: wait
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID_PROD }}
        run: |
          set -euo pipefail
          # Poll /v1/services/{id}/deploys until we see a deploy whose
          # commit matches $GITHUB_SHA reach status=live (success) or
          # one of the terminal failure statuses. 20 min cap matches
          # Render's own deploy timeout.
          DEADLINE=$(( $(date +%s) + 1200 ))
          SHA_SHORT="${GITHUB_SHA:0:7}"
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            DEPLOYS=$(curl --fail --silent \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Accept: application/json" \
              "https://api.render.com/v1/services/${SERVICE_ID}/deploys?limit=20")

            DEPLOY=$(echo "$DEPLOYS" | jq --arg sha "$SHA_SHORT" '
              [.[] | select(.deploy.commit.id // "" | startswith($sha))][0].deploy // empty
            ')
            if [ -z "$DEPLOY" ] || [ "$DEPLOY" = "null" ]; then
              echo "No deploy yet for ${SHA_SHORT}; waiting..."
              sleep 15
              continue
            fi

            STATUS=$(echo "$DEPLOY" | jq -r '.status')
            DEPLOY_ID=$(echo "$DEPLOY" | jq -r '.id')
            echo "Deploy ${DEPLOY_ID}: ${STATUS}"

            case "$STATUS" in
              live)
                echo "deploy_id=${DEPLOY_ID}" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              build_failed|update_failed|canceled|deactivated|pre_deploy_failed)
                echo "::error::Deploy ${DEPLOY_ID} terminated with status=${STATUS}"
                exit 1
                ;;
              *)
                sleep 15
                ;;
            esac
          done
          echo "::error::Timed out waiting for deploy of ${SHA_SHORT}"
          exit 1

      - name: Smoke test
        env:
          BASE_URL: ${{ vars.BACKEND_URL_PROD }}
        run: scripts/smoke/smoke.sh "$BASE_URL"

      - name: Roll back on smoke failure
        if: failure() && steps.wait.outcome == 'success'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID_PROD }}
        run: |
          set -euo pipefail
          echo "::warning::Smoke test failed — rolling back."
          SHA_SHORT="${GITHUB_SHA:0:7}"
          # Find the most recent successful deploy *before* the one
          # we just shipped, then POST it to /rollback. In Render's
          # deploy lifecycle, only the currently-serving deploy has
          # status=live; previously-successful deploys move to
          # status=deactivated when superseded. Our broken just-shipped
          # deploy is still "live" at this point (smoke runs after the
          # health-check gate flips traffic), so we accept either
          # status and exclude the current SHA — the most recent match
          # is the predecessor we want to roll back to.
          PREV=$(curl --fail --silent \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Accept: application/json" \
            "https://api.render.com/v1/services/${SERVICE_ID}/deploys?limit=20" \
            | jq --arg sha "$SHA_SHORT" -r '
              [.[]
                | .deploy
                | select(.status == "live" or .status == "deactivated")
                | select((.commit.id // "") | startswith($sha) | not)
              ][0].id // empty
            ')
          if [ -z "$PREV" ]; then
            echo "::error::No previous successful deploy to roll back to — manual recovery required."
            exit 1
          fi
          # Render's rollback endpoint is /v1/services/{id}/deploys/{deployId}/rollback
          # — deploy ID is a path parameter, no body required. The
          # service-level /rollback URL with deployId in the body
          # returns 404.
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Accept: application/json" \
            "https://api.render.com/v1/services/${SERVICE_ID}/deploys/${PREV}/rollback" > /dev/null
          echo "::notice::Rolled back to ${PREV}"
