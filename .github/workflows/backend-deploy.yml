name: Backend Deploy

# Deploy model (ADR-0006 + staging extension):
#   push to main  → staging  (Coolify auto-deploys)
#   push tag v*   → production (CI triggers Coolify webhook)
#   workflow_dispatch → choose staging or production
#
# Deploy target: Hetzner CX33 + Coolify.
# Day-2 ops: docs/process/runbook.md
#
# Required repo secrets:
#   COOLIFY_API_TOKEN                Coolify API token (Keys & Tokens)
#   COOLIFY_DEPLOY_WEBHOOK_URL       Production Coolify app deploy webhook
#   COOLIFY_STAGING_DEPLOY_WEBHOOK_URL  Staging Coolify app deploy webhook
#
# Required repo variables:
#   BACKEND_URL_PROD                 e.g. https://api.tarmoto.app
#   BACKEND_URL_STAGING              e.g. https://api.staging.tarmoto.app
#   COOLIFY_APPLICATION_UUID         Production Coolify app UUID
#   COOLIFY_STAGING_APPLICATION_UUID Staging Coolify app UUID

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "apps/backend/**"
      - "packages/shared/**"
      - "packages/openapi/**"
      - "docs/database/**"
      - ".github/workflows/backend-deploy.yml"
      - "scripts/smoke/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: ["staging", "production"]
        default: "staging"

permissions:
  contents: read

concurrency:
  group: backend-deploy-${{ inputs.environment || (startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging') }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy & verify
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment || (startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging') }}

    steps:
      - uses: actions/checkout@v6

      - name: Resolve environment
        id: env
        env:
          INPUT_ENV: ${{ inputs.environment || '' }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          if [ "$IS_TAG" = "true" ]; then
            ENV_NAME="production"
          elif [ -n "$INPUT_ENV" ]; then
            ENV_NAME="$INPUT_ENV"
          else
            ENV_NAME="staging"
          fi
          echo "name=${ENV_NAME}" >> "$GITHUB_OUTPUT"

      - name: Trigger Coolify deploy (production only)
        if: steps.env.outputs.name == 'production'
        env:
          WEBHOOK_URL: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK_URL }}
        run: |
          echo "Triggering production deploy..."
          curl --fail --silent --show-error -X POST "$WEBHOOK_URL"
          echo "Webhook accepted — Coolify is building."

      - name: Wait for deploy to go live
        env:
          BASE_URL: ${{ steps.env.outputs.name == 'production' && vars.BACKEND_URL_PROD || vars.BACKEND_URL_STAGING }}
        run: |
          set -euo pipefail
          # Coolify's rolling update builds the image, starts a new
          # container, and waits for the Docker HEALTHCHECK to pass
          # before switching traffic. We poll the app healthcheck
          # endpoint until it returns 200 — the new container is live.
          DEADLINE=$(( $(date +%s) + 600 ))
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' \
              "${BASE_URL}/api/v1/healthz" || echo '000')
            if [ "$CODE" = "200" ]; then
              echo "Healthcheck passed (200)"
              exit 0
            fi
            echo "Healthcheck returned ${CODE}; waiting..."
            sleep 10
          done
          echo "::error::Timed out waiting for healthy deploy"
          exit 1

      - name: Smoke test
        env:
          BASE_URL: ${{ steps.env.outputs.name == 'production' && vars.BACKEND_URL_PROD || vars.BACKEND_URL_STAGING }}
        run: scripts/smoke/smoke.sh "$BASE_URL"

      - name: Roll back on smoke failure
        if: failure()
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          APPLICATION_UUID: ${{ steps.env.outputs.name == 'production' && vars.COOLIFY_APPLICATION_UUID || vars.COOLIFY_STAGING_APPLICATION_UUID }}
          COOLIFY_URL: https://coolify.studio81.cz
        run: |
          set -euo pipefail
          echo "::warning::Smoke test failed — rolling back via Coolify API."

          DEPLOYS=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
            -H "Accept: application/json" \
            "${COOLIFY_URL}/api/v1/applications/${APPLICATION_UUID}")

          CURRENT=$(echo "$DEPLOYS" | jq -r '.deployments[0].id // empty')
          PREV=$(echo "$DEPLOYS" | jq -r '.deployments[1].id // empty')

          if [ -z "$PREV" ]; then
            echo "::error::No previous deployment to roll back to."
            echo "::error::Open Coolify → Deployments → Redeploy a previous successful deploy."
            exit 1
          fi

          echo "Rolling back from ${CURRENT} to ${PREV}..."
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
            -H "Accept: application/json" \
            "${COOLIFY_URL}/api/v1/applications/${APPLICATION_UUID}/deployments/${PREV}/rollback" \
            > /dev/null
          echo "::notice::Rolled back to deployment ${PREV}"
