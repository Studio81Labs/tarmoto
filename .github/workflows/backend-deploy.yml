name: Backend Deploy

# Render handles the Docker build + deploy itself, off `git push` to
# main (see infra/render/render.yaml's autoDeploy flag). This workflow
# waits for Render to finish, runs a smoke test, and triggers a
# rollback on smoke failure.
#
# Tag-driven prod release: pushing `backend-v*` POSTs to the prod
# service's deploy hook (since prod has autoDeploy: false), then waits
# + smoke-tests. Workflow_dispatch covers hotfixes.
#
# Choice rationale: docs/decisions/0005-deployment-stack-render.md
# Day-2 ops: docs/process/runbook.md
#
# Required repo secrets:
#   RENDER_API_KEY              Render account API key
#   RENDER_SERVICE_ID_STAGING   `srv-...` for the staging Web Service
#   RENDER_SERVICE_ID_PROD      `srv-...` for the prod Web Service (when added)
#   RENDER_DEPLOY_HOOK_PROD     Deploy-hook URL for prod (autoDeploy: false)
#
# Required repo variables:
#   BACKEND_URL_STAGING         e.g. https://api.staging.tarmoto.app
#   BACKEND_URL_PROD            e.g. https://api.tarmoto.app

on:
  push:
    branches: [main]
    tags: ["backend-v*"]
    paths:
      - "apps/backend/**"
      - "packages/shared/**"
      - "packages/openapi/**"
      - "infra/render/**"
      - ".github/workflows/backend-deploy.yml"
      - "scripts/smoke/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        default: staging
        options: [staging, prod]

permissions:
  contents: read

concurrency:
  group: backend-deploy-${{ github.event.inputs.environment || (startsWith(github.ref, 'refs/tags/') && 'prod') || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy & verify
    runs-on: ubuntu-latest

    # `staging` and `production` GitHub environments enforce required
    # reviewers / branch protections. Prod gets a manual approval.
    environment: ${{ (github.event.inputs.environment == 'prod' || startsWith(github.ref, 'refs/tags/backend-v')) && 'production' || 'staging' }}

    steps:
      - uses: actions/checkout@v6

      - name: Resolve target environment
        id: env
        env:
          DISPATCH_ENV: ${{ github.event.inputs.environment }}
          REF_NAME: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
          SERVICE_ID_STAGING: ${{ secrets.RENDER_SERVICE_ID_STAGING }}
          SERVICE_ID_PROD: ${{ secrets.RENDER_SERVICE_ID_PROD }}
          URL_STAGING: ${{ vars.BACKEND_URL_STAGING }}
          URL_PROD: ${{ vars.BACKEND_URL_PROD }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            ENV_NAME="$DISPATCH_ENV"
          elif [[ "$REF_NAME" == refs/tags/backend-v* ]]; then
            ENV_NAME="prod"
          else
            ENV_NAME="staging"
          fi
          if [ "$ENV_NAME" = "prod" ]; then
            SERVICE_ID="$SERVICE_ID_PROD"
            URL="$URL_PROD"
          else
            SERVICE_ID="$SERVICE_ID_STAGING"
            URL="$URL_STAGING"
          fi
          {
            echo "name=${ENV_NAME}"
            echo "service_id=${SERVICE_ID}"
            echo "url=${URL}"
          } >> "$GITHUB_OUTPUT"

      - name: Trigger prod deploy hook
        # Staging auto-deploys from `git push`; prod has autoDeploy: false
        # in the blueprint, so we POST the deploy hook explicitly.
        if: steps.env.outputs.name == 'prod'
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_PROD }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_PROD is not set"
            exit 1
          fi
          curl --fail --silent --show-error -X POST "$DEPLOY_HOOK" > /dev/null
          echo "Triggered prod deploy hook for ${GITHUB_SHA}."

      - name: Wait for deploy to go live
        id: wait
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ steps.env.outputs.service_id }}
        run: |
          set -euo pipefail
          # Poll /v1/services/{id}/deploys until we see a deploy whose
          # commit matches $GITHUB_SHA reach status=live (success) or
          # one of the terminal failure statuses. 20 min cap matches
          # Render's own deploy timeout.
          DEADLINE=$(( $(date +%s) + 1200 ))
          SHA_SHORT="${GITHUB_SHA:0:7}"
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            DEPLOYS=$(curl --fail --silent \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Accept: application/json" \
              "https://api.render.com/v1/services/${SERVICE_ID}/deploys?limit=20")

            DEPLOY=$(echo "$DEPLOYS" | jq --arg sha "$SHA_SHORT" '
              [.[] | select(.deploy.commit.id // "" | startswith($sha))][0].deploy // empty
            ')
            if [ -z "$DEPLOY" ] || [ "$DEPLOY" = "null" ]; then
              echo "No deploy yet for ${SHA_SHORT}; waiting..."
              sleep 15
              continue
            fi

            STATUS=$(echo "$DEPLOY" | jq -r '.status')
            DEPLOY_ID=$(echo "$DEPLOY" | jq -r '.id')
            echo "Deploy ${DEPLOY_ID}: ${STATUS}"

            case "$STATUS" in
              live)
                echo "deploy_id=${DEPLOY_ID}" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              build_failed|update_failed|canceled|deactivated|pre_deploy_failed)
                echo "::error::Deploy ${DEPLOY_ID} terminated with status=${STATUS}"
                exit 1
                ;;
              *)
                sleep 15
                ;;
            esac
          done
          echo "::error::Timed out waiting for deploy of ${SHA_SHORT}"
          exit 1

      - name: Smoke test
        env:
          BASE_URL: ${{ steps.env.outputs.url }}
        run: scripts/smoke/smoke.sh "$BASE_URL"

      - name: Roll back on smoke failure
        if: failure() && steps.wait.outcome == 'success'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ steps.env.outputs.service_id }}
        run: |
          set -euo pipefail
          echo "::warning::Smoke test failed — rolling back."
          SHA_SHORT="${GITHUB_SHA:0:7}"
          # Find the most recent successful deploy *before* the one
          # we just shipped, then POST it to /rollback.
          PREV=$(curl --fail --silent \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Accept: application/json" \
            "https://api.render.com/v1/services/${SERVICE_ID}/deploys?limit=20" \
            | jq --arg sha "$SHA_SHORT" -r '
              [.[]
                | .deploy
                | select(.status == "live")
                | select((.commit.id // "") | startswith($sha) | not)
              ][0].id // empty
            ')
          if [ -z "$PREV" ]; then
            echo "::error::No previous live deploy to roll back to — manual recovery required."
            exit 1
          fi
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"deployId\":\"${PREV}\"}" \
            "https://api.render.com/v1/services/${SERVICE_ID}/rollback" > /dev/null
          echo "::notice::Rolled back to ${PREV}"
