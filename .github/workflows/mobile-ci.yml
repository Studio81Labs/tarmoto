name: Mobile CI

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/shared/**"
      - "packages/openapi/**"
      - "patches/**"
      - "scripts/eslint/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/mobile-ci.yml"
      - ".github/workflows/_build-openapi.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/shared/**"
      - "packages/openapi/**"
      - "patches/**"
      - "scripts/eslint/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/mobile-ci.yml"
      - ".github/workflows/_build-openapi.yml"
  # Manual rehearsal of the full workflow INCLUDING the preview builds, which
  # PRs deliberately skip for cost. This is the pre-merge proof for changes to
  # the native toolchain (Gradle wrapper, Ruby pin, Xcode/Java versions) —
  # exactly the class of change that broke every main build for a week when
  # it shipped unexercised (#1249).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PRs group by PR number so a new push supersedes the run before it. Pushes
  # group by commit SHA so every commit on main gets its own group and is
  # validated on its own.
  #
  # The SHA matters. With `github.ref` there is one group for the whole branch,
  # so merges cancel each other and commits landing in quick succession are
  # never validated. That happened to nexcue on 2026-08-06: the merge commit
  # for their #676 finished with zero check-runs while a later commit had
  # fifteen.
  #
  # `cancel-in-progress: false` does *not* fix that on its own. GitHub keeps
  # only one pending run per group — a newly queued run cancels the previously
  # pending one whatever this flag says — so with three merges in flight the
  # middle commit is still dropped. Only a per-commit group covers every one.
  #
  # Worth knowing when reading history: a cancelled run reports as *failed*, so
  # the symptom looks like a broken branch rather than an unverified one.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # Build the OpenAPI spec once (reusable workflow) and fan it out as an
  # artifact, instead of rebuilding the backend inline here.
  prepare-openapi:
    name: "contract: openapi spec"
    uses: ./.github/workflows/_build-openapi.yml

  build:
    name: "mobile: lint, typecheck & test"
    needs: prepare-openapi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm shared:build

      - name: Download generated OpenAPI spec
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: openapi-spec
          path: ${{ runner.temp }}

      - name: Restore generated OpenAPI spec
        run: |
          mkdir -p packages/openapi
          tar -xzf "$RUNNER_TEMP/openapi-spec.tgz" -C packages/openapi

      # Mobile imports @tarmoto/openapi-client, whose generated schema.d.ts is
      # produced from the spec above (both are gitignored). Without it the
      # mobile typecheck can't resolve the generated module and openapi-fetch's
      # overloads fall back to implicit `any`.
      - name: Generate OpenAPI client
        run: pnpm --filter @tarmoto/openapi-client generate

      - name: Lint
        run: pnpm --filter @tarmoto/mobile lint

      - name: Typecheck
        run: pnpm --filter @tarmoto/mobile typecheck

      - name: Test
        run: pnpm --filter @tarmoto/mobile test

  android-preview:
    name: "mobile: android preview apk"
    needs: build
    # Preview artifacts are expensive and only useful from an integrated
    # revision. PRs still run the full lint/typecheck/test job above.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared package
        run: pnpm shared:build
      # Release builds bundle Hermes/JS and assets, so the uploaded APK runs
      # without Metro and catches bundling failures that assembleDebug misses.
      - name: Build standalone preview APK
        working-directory: apps/mobile/android
        run: >-
          ./gradlew :app:assembleRelease
          -PTARMOTO_PREVIEW_SIGNING=true
          -PreactNativeArchitectures=arm64-v8a,x86_64
          --console=plain
      - name: Upload Android preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tarmoto-android-preview
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7

  ios-preview:
    name: "mobile: ios simulator preview"
    needs: build
    # macOS minutes are especially costly; build the simulator artifact once
    # after merge instead of on every PR synchronization/review-fix push.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    # React Native Firebase 25's Apple SDK requires Xcode 26.2 or newer.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          # No ruby-version here on purpose: setup-ruby reads
          # apps/mobile/.ruby-version (via working-directory), the same pin
          # bundler enforces from the Gemfile. Hardcoding it is how #1178
          # broke every main build for a week (Gemfile said 3.4.10, CI
          # installed 3.3.6) without any PR check noticing.
          bundler-cache: true
          working-directory: apps/mobile
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.4.app
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared package
        run: pnpm shared:build
      - name: Install CocoaPods
        working-directory: apps/mobile
        run: pnpm exec react-native build-ios --only-pods
      - name: Build simulator app
        working-directory: apps/mobile/ios
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace TarmotoApp.xcworkspace \
            -scheme TarmotoApp \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/tarmoto-derived-data" \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipPackageUpdates \
            CODE_SIGNING_ALLOWED=NO \
            build
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/tarmoto-derived-data/Build/Products/Release-iphonesimulator/TarmotoApp.app" \
            "$RUNNER_TEMP/TarmotoApp-simulator.zip"
      - name: Upload iOS preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tarmoto-ios-simulator-preview
          path: ${{ runner.temp }}/TarmotoApp-simulator.zip
          retention-days: 7
