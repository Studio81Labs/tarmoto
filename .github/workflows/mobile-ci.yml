name: Mobile CI

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/shared/**"
      - "packages/openapi/**"
      - ".github/workflows/mobile-ci.yml"
      - ".github/workflows/_build-openapi.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/shared/**"
      - "packages/openapi/**"
      - ".github/workflows/mobile-ci.yml"
      - ".github/workflows/_build-openapi.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Build the OpenAPI spec once (reusable workflow) and fan it out as an
  # artifact, instead of rebuilding the backend inline here.
  prepare-openapi:
    uses: ./.github/workflows/_build-openapi.yml

  build:
    name: Build & Test
    needs: prepare-openapi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm shared:build

      - name: Download generated OpenAPI spec
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: openapi-spec
          path: ${{ runner.temp }}

      - name: Restore generated OpenAPI spec
        run: |
          mkdir -p packages/openapi
          tar -xzf "$RUNNER_TEMP/openapi-spec.tgz" -C packages/openapi

      # Mobile imports @tarmoto/openapi-client, whose generated schema.d.ts is
      # produced from the spec above (both are gitignored). Without it the
      # mobile typecheck can't resolve the generated module and openapi-fetch's
      # overloads fall back to implicit `any`.
      - name: Generate OpenAPI client
        run: pnpm --filter @tarmoto/openapi-client generate

      - name: Lint
        run: pnpm --filter @tarmoto/mobile lint

      - name: Typecheck
        run: pnpm --filter @tarmoto/mobile typecheck

      - name: Test
        run: pnpm --filter @tarmoto/mobile test
