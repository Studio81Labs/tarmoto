name: Mobile CI

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/shared/**"
      - "packages/openapi/**"
      - "patches/**"
      - "scripts/eslint/**"
      - "pnpm-workspace.yaml"
      - ".github/workflows/mobile-ci.yml"
      - ".github/workflows/_build-openapi.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/shared/**"
      - "packages/openapi/**"
      - "patches/**"
      - "scripts/eslint/**"
      - "pnpm-workspace.yaml"
      - ".github/workflows/mobile-ci.yml"
      - ".github/workflows/_build-openapi.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Build the OpenAPI spec once (reusable workflow) and fan it out as an
  # artifact, instead of rebuilding the backend inline here.
  prepare-openapi:
    uses: ./.github/workflows/_build-openapi.yml

  build:
    name: Build & Test
    needs: prepare-openapi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm shared:build

      - name: Download generated OpenAPI spec
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: openapi-spec
          path: ${{ runner.temp }}

      - name: Restore generated OpenAPI spec
        run: |
          mkdir -p packages/openapi
          tar -xzf "$RUNNER_TEMP/openapi-spec.tgz" -C packages/openapi

      # Mobile imports @tarmoto/openapi-client, whose generated schema.d.ts is
      # produced from the spec above (both are gitignored). Without it the
      # mobile typecheck can't resolve the generated module and openapi-fetch's
      # overloads fall back to implicit `any`.
      - name: Generate OpenAPI client
        run: pnpm --filter @tarmoto/openapi-client generate

      - name: Lint
        run: pnpm --filter @tarmoto/mobile lint

      - name: Typecheck
        run: pnpm --filter @tarmoto/mobile typecheck

      - name: Test
        run: pnpm --filter @tarmoto/mobile test

  android-preview:
    name: Android Preview APK
    needs: build
    # Preview artifacts are expensive and only useful from an integrated
    # revision. PRs still run the full lint/typecheck/test job above.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared package
        run: pnpm shared:build
      # Release builds bundle Hermes/JS and assets, so the uploaded APK runs
      # without Metro and catches bundling failures that assembleDebug misses.
      - name: Build standalone preview APK
        working-directory: apps/mobile/android
        run: >-
          ./gradlew :app:assembleRelease
          -PTARMOTO_PREVIEW_SIGNING=true
          -PreactNativeArchitectures=arm64-v8a,x86_64
          --console=plain
      - name: Upload Android preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tarmoto-android-preview
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7

  ios-preview:
    name: iOS Simulator Preview
    needs: build
    # macOS minutes are especially costly; build the simulator artifact once
    # after merge instead of on every PR synchronization/review-fix push.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # React Native Firebase 25's Apple SDK requires Xcode 26.2 or newer.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: ruby/setup-ruby@0dafeac902942906541bc140009cdbf32665b601 # v1.315.0
        with:
          ruby-version: "3.3.6"
          bundler-cache: true
          working-directory: apps/mobile
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.4.app
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared package
        run: pnpm shared:build
      - name: Install CocoaPods
        working-directory: apps/mobile
        run: pnpm exec react-native build-ios --only-pods
      - name: Build simulator app
        working-directory: apps/mobile/ios
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace TarmotoApp.xcworkspace \
            -scheme TarmotoApp \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/tarmoto-derived-data" \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipPackageUpdates \
            CODE_SIGNING_ALLOWED=NO \
            build
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/tarmoto-derived-data/Build/Products/Release-iphonesimulator/TarmotoApp.app" \
            "$RUNNER_TEMP/TarmotoApp-simulator.zip"
      - name: Upload iOS preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tarmoto-ios-simulator-preview
          path: ${{ runner.temp }}/TarmotoApp-simulator.zip
          retention-days: 7
