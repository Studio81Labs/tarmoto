name: Mobile CI

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/shared/**"
      - "packages/openapi/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/shared/**"
      - "packages/openapi/**"
      - ".github/workflows/mobile-ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm shared:build

      - name: Generate OpenAPI client
        # Mobile imports from @tarmoto/openapi, whose types.ts is
        # generated from the backend's swagger spec (both types.ts and
        # openapi.yaml are gitignored). Without this step the mobile
        # typecheck fails with "Cannot find module './types.js'" — and
        # because openapi-fetch's overloaded methods can't resolve
        # path types when `paths` is unknown, callers' `bodySerializer`
        # parameters silently fall back to implicit `any`, which
        # produces additional spurious TS7006 errors downstream.
        run: pnpm openapi:gen

      - name: Lint
        run: pnpm --filter @tarmoto/mobile lint

      - name: Typecheck
        run: pnpm --filter @tarmoto/mobile typecheck

      - name: Test
        run: pnpm --filter @tarmoto/mobile test
