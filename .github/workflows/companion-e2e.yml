name: Companion E2E

on:
  push:
    branches: [main]
    paths:
      - "apps/companion/**"
      - "apps/backend/**"
      - "packages/shared/**"
      - "packages/openapi/**"
      - ".github/workflows/companion-e2e.yml"
      - ".github/workflows/_build-openapi.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/companion/**"
      - "apps/backend/**"
      - "packages/shared/**"
      - "packages/openapi/**"
      - ".github/workflows/companion-e2e.yml"
      - ".github/workflows/_build-openapi.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Build the OpenAPI spec once (reusable workflow) and fan it out as an
  # artifact, instead of rebuilding the backend inline here.
  prepare-openapi:
    uses: ./.github/workflows/_build-openapi.yml

  playwright:
    name: Playwright
    needs: prepare-openapi
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm shared:build

      - name: Download generated OpenAPI spec
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: openapi-spec
          path: ${{ runner.temp }}

      - name: Restore generated OpenAPI spec
        run: |
          mkdir -p packages/openapi
          tar -xzf "$RUNNER_TEMP/openapi-spec.tgz" -C packages/openapi

      - name: Generate OpenAPI client
        run: pnpm --filter @tarmoto/openapi-client generate

      - name: Get Playwright version
        id: playwright-version
        run: |
          version=$(node -p "require('./apps/companion/package.json').devDependencies['@playwright/test'].replace(/[^0-9.]/g, '')")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: pnpm --filter @tarmoto/companion exec playwright install --with-deps chromium

      - name: Install Playwright browser system deps
        if: steps.cache-playwright.outputs.cache-hit == 'true'
        run: pnpm --filter @tarmoto/companion exec playwright install-deps chromium

      - name: Run Playwright tests
        env:
          CI: "1"
        run: pnpm --filter @tarmoto/companion test:e2e

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces
          path: apps/companion/e2e/.results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload HTML report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: apps/companion/e2e/.report/
          retention-days: 14
          if-no-files-found: ignore
