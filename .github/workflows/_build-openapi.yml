name: Build Backend & Export OpenAPI

# Reusable workflow: builds @tarmoto/shared + the backend, exports the OpenAPI
# spec, and uploads it as the `openapi-spec` artifact. Client-consuming
# workflows (admin/companion/mobile CI, packages CI) call this once and then
# download the spec + regenerate the TS client, instead of each rebuilding the
# backend inline. Mirrors the sibling monorepos' _build-openapi.yml.
#
# The export script self-defaults all DB/Redis/JWT env, so no secrets are
# needed — see apps/backend/src/scripts/export-openapi.ts.

on:
  workflow_call:
    inputs:
      artifact-retention-days:
        description: Retention for the openapi-spec artifact.
        required: false
        type: number
        default: 1
      ref:
        description: >-
          Git ref/SHA to check out before exporting the spec. Defaults to the
          triggering commit (github.sha), so the exported spec matches the exact
          commit the consumer jobs check out (their default checkout uses
          github.sha too) — NOT the moving branch tip, which could advance
          mid-run and export a newer backend contract than the consumers build.
          Callers that must align with a moving ref (e.g. a deploy building from
          main HEAD) override this explicitly.
        required: false
        type: string
        default: ""

jobs:
  export:
    name: Export OpenAPI spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm shared:build

      - name: Build ingest package
        run: pnpm ingest:build

      - name: Build poi-db package
        run: pnpm poi-db:build

      - name: Export OpenAPI spec
        run: pnpm --filter @tarmoto/backend openapi:export

      - name: Archive generated OpenAPI spec
        run: tar -czf "$RUNNER_TEMP/openapi-spec.tgz" -C packages/openapi openapi.yaml

      - name: Upload generated OpenAPI spec
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openapi-spec
          path: ${{ runner.temp }}/openapi-spec.tgz
          retention-days: ${{ inputs.artifact-retention-days }}
