name: Ingest Deploy

# Reusable workflow (`workflow_call`), invoked by deploy.yml — the single
# entry point for Coolify deploys. deploy.yml resolves staging vs
# production (push to main, tag v*, or a workflow_dispatch choice), runs
# this workflow BEFORE backend-deploy.yml (ingest is the sole POI-schema
# migrator; backend only reads it), and passes the resolved environment
# in as the `environment` input below. This workflow has no push/tag/
# workflow_dispatch triggers of its own.
#
# Deploy target: self-hosted Coolify PaaS. Staging and production are
# triggered by the SAME authenticated Coolify API call — Coolify "Auto
# Deploy" is kept OFF so CI is the single source of deploys. Mirrors
# backend-deploy.yml; see that file for the full pattern this was copied from.
#
# Day-2 ops: docs/process/runbook.md
#
# Required repo secrets:
#   COOLIFY_API_TOKEN                 PaaS API token (issued from PaaS dashboard)
#
# Required repo variables:
#   COOLIFY_API_BASE_URL   Base URL of the PaaS API (no trailing slash)
#
# Required per-environment (staging / production) variables:
#   INGEST_URL             e.g. https://ingest.tarmoto.app (prod) or
#                          https://ingest-staging.tarmoto.app (staging)
#   COOLIFY_INGEST_UUID    the ingest app's Coolify UUID

on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment (staging | production)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ingest-deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: "ingest: deploy & verify"
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so scripts/ci/resolve-app-version.sh can `git describe`
          # against the latest v-tag.
          fetch-depth: 0

      - name: Resolve environment
        id: env
        # The orchestrator (deploy.yml) resolves staging vs production and
        # passes it in as a required workflow_call input, so this step just
        # surfaces it as a step output for the rest of the job to consume.
        env:
          ENV_NAME: ${{ inputs.environment }}
        run: |
          echo "name=${ENV_NAME}" >> "$GITHUB_OUTPUT"

      - name: Resolve env-specific deploy targets
        id: resolve
        # The job-level `environment:` declaration scopes vars to the right env,
        # so we read the unsuffixed names directly. We still validate non-empty
        # so a missing per-env value fails loudly with a clear message instead
        # of bubbling up as a curl 401 / unbound shell var later.
        env:
          ENV_NAME: ${{ steps.env.outputs.name }}
          BASE_URL: ${{ vars.INGEST_URL }}
          APP_UUID: ${{ vars.COOLIFY_INGEST_UUID }}
        run: |
          set -euo pipefail
          test -n "$BASE_URL" || {
            echo "::error::INGEST_URL var is not set in env ${ENV_NAME}"
            exit 1
          }
          test -n "$APP_UUID" || {
            echo "::error::COOLIFY_INGEST_UUID var is not set in env ${ENV_NAME}"
            exit 1
          }
          echo "base_url=${BASE_URL}" >> "$GITHUB_OUTPUT"
          echo "app_uuid=${APP_UUID}" >> "$GITHUB_OUTPUT"

      - name: Resolve app version
        id: version
        run: |
          set -euo pipefail
          APP_VERSION="$(bash scripts/ci/resolve-app-version.sh)"
          test -n "$APP_VERSION" || {
            echo "::error::Unable to resolve ingest app version"
            exit 1
          }
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved ingest app version: ${APP_VERSION}"

      - name: Set Coolify ingest version env
        # Stamp the resolved version into Coolify BEFORE triggering the deploy so
        # the new container builds/runs with it. Fills TARMOTO_APP_VERSION and
        # TARMOTO_SENTRY_RELEASE (both = the resolved version), mirroring
        # backend-deploy.yml. Coolify's envs/bulk upserts the given keys (it
        # does not replace the whole env). TARMOTO_DEPLOY_ENV is NOT stamped
        # here — it's a static per-environment Coolify var, set once per app,
        # not derived from the deploy.
        env:
          ENV_NAME: ${{ steps.env.outputs.name }}
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_URL: ${{ vars.COOLIFY_API_BASE_URL }}
          APPLICATION_UUID: ${{ steps.resolve.outputs.app_uuid }}
        run: |
          set -euo pipefail
          test -n "$COOLIFY_API_TOKEN" || {
            echo "::error::COOLIFY_API_TOKEN secret is not set"
            exit 1
          }
          test -n "$COOLIFY_URL" || {
            echo "::error::COOLIFY_API_BASE_URL repo variable is not set"
            exit 1
          }

          REQUEST="$(mktemp)"
          RESPONSE="$(mktemp)"
          jq -n --arg version "$APP_VERSION" \
            '{data: [
              {key: "TARMOTO_APP_VERSION", value: $version, is_literal: true, is_multiline: false, is_preview: false, is_buildtime: true, is_runtime: true},
              {key: "TARMOTO_SENTRY_RELEASE", value: $version, is_literal: true, is_multiline: false, is_preview: false, is_buildtime: true, is_runtime: true}
            ]}' \
            > "$REQUEST"

          set +e
          HTTP_CODE=$(curl --silent --show-error --output "$RESPONSE" \
            --write-out '%{http_code}' \
            --max-time 30 --request PATCH \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            --data @"$REQUEST" \
            "${COOLIFY_URL}/api/v1/applications/${APPLICATION_UUID}/envs/bulk")
          CURL_EXIT=$?
          set -e

          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "::error::Coolify env update failed before receiving an HTTP response"
            rm -f "$REQUEST" "$RESPONSE"
            exit 1
          fi
          if [ "$HTTP_CODE" = "401" ] || [ "$HTTP_CODE" = "403" ]; then
            echo "::error::Coolify API returned HTTP ${HTTP_CODE} while setting the version env. Refresh COOLIFY_API_TOKEN and make sure it can update application envs."
            head -c 400 "$RESPONSE"; echo
            rm -f "$REQUEST" "$RESPONSE"
            exit 1
          fi
          if [ "$HTTP_CODE" = "404" ]; then
            echo "::error::Coolify API returned HTTP 404 while setting the version env. Check COOLIFY_INGEST_UUID."
            rm -f "$REQUEST" "$RESPONSE"
            exit 1
          fi
          if [[ ! "$HTTP_CODE" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error::Coolify API returned HTTP ${HTTP_CODE} while setting the version env"
            head -c 400 "$RESPONSE"; echo
            rm -f "$REQUEST" "$RESPONSE"
            exit 1
          fi
          rm -f "$REQUEST" "$RESPONSE"
          echo "Coolify TARMOTO_APP_VERSION and TARMOTO_SENTRY_RELEASE set to ${APP_VERSION}"

      - name: Trigger Coolify deploy
        id: trigger_deploy
        env:
          ENV_NAME: ${{ steps.env.outputs.name }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_URL: ${{ vars.COOLIFY_API_BASE_URL }}
          APPLICATION_UUID: ${{ steps.resolve.outputs.app_uuid }}
        run: |
          set -euo pipefail
          test -n "$COOLIFY_API_TOKEN" || {
            echo "::error::COOLIFY_API_TOKEN secret is not set"
            exit 1
          }
          test -n "$COOLIFY_URL" || {
            echo "::error::COOLIFY_API_BASE_URL repo variable is not set"
            exit 1
          }
          echo "Triggering ${ENV_NAME} deploy..."
          BODY="$(mktemp)"
          set +e
          HTTP_CODE=$(curl --silent --show-error --output "$BODY" \
            --write-out '%{http_code}' \
            --max-time 30 --get \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
            -H "Accept: application/json" \
            --data-urlencode "uuid=${APPLICATION_UUID}" \
            "${COOLIFY_URL}/api/v1/deploy")
          CURL_EXIT=$?
          set -e
          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "::error::Coolify deploy request failed before receiving an HTTP response"
            rm -f "$BODY"
            exit 1
          fi
          if [[ ! "$HTTP_CODE" =~ ^2[0-9][0-9]$ ]]; then
            if [ "$HTTP_CODE" = "401" ] || [ "$HTTP_CODE" = "403" ]; then
              echo "::error::Coolify deploy API returned HTTP ${HTTP_CODE}. Refresh COOLIFY_API_TOKEN and make sure it can deploy applications."
            else
              echo "::error::Coolify deploy API returned HTTP ${HTTP_CODE}"
            fi
            head -c 400 "$BODY"; echo
            rm -f "$BODY"
            exit 1
          fi
          DEPLOYMENT_ID=$(jq -r '.deployments[0].deployment_uuid // .deployments[0].uuid // .deployments[0].id // empty' < "$BODY" 2>/dev/null || echo '')
          if [ -z "$DEPLOYMENT_ID" ] || [ "$DEPLOYMENT_ID" = "null" ]; then
            echo "::error::Coolify deploy API response did not include a deployment UUID"
            head -c 400 "$BODY"; echo
            rm -f "$BODY"
            exit 1
          fi
          rm -f "$BODY"
          echo "deployment_id=${DEPLOYMENT_ID}" >> "$GITHUB_OUTPUT"
          echo "Coolify accepted deployment id=${DEPLOYMENT_ID}"

      - name: Wait for Coolify deploy to finish
        id: wait_deploy
        # Don't trust the app's healthcheck endpoint to tell us the NEW
        # container is live: Coolify's rolling-update keeps the OLD
        # container serving 200 until traffic switches, so a naive
        # `curl /healthz` poll would pass on the very first iteration
        # against the previous build. Track the specific deployment id.
        env:
          ENV_NAME: ${{ steps.env.outputs.name }}
          DEPLOYMENT_ID: ${{ steps.trigger_deploy.outputs.deployment_id }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          APPLICATION_UUID: ${{ steps.resolve.outputs.app_uuid }}
          COOLIFY_URL: ${{ vars.COOLIFY_API_BASE_URL }}
        run: |
          # Drop -e: each iteration handles its own errors so a single
          # transient curl/jq failure doesn't kill the whole poll. We
          # keep -u (catch typos in env vars) and pipefail (so a broken
          # `curl | jq` pipeline still bubbles up rather than silently
          # producing empty output the parser misinterprets).
          set +e
          set -uo pipefail

          test -n "$COOLIFY_API_TOKEN" || {
            echo "::error::COOLIFY_API_TOKEN secret is not set"
            exit 1
          }
          test -n "$COOLIFY_URL" || {
            echo "::error::COOLIFY_API_BASE_URL repo variable is not set"
            exit 1
          }
          test -n "$DEPLOYMENT_ID" || {
            echo "::error::Coolify deployment id was not captured"
            exit 1
          }

          DEPLOYMENTS_JQ='if type == "array" then . elif type == "object" and (.deployments | type == "array") then .deployments else empty end'

          fetch_deploys() {
            # Defensive curl: --retry handles dns/connect/5xx; non-200 →
            # caller treats as transient. Body to a temp file so we can
            # validate it's JSON before parsing.
            local out_file="$1"
            local code
            code=$(curl --silent --show-error --output "$out_file" \
              --write-out '%{http_code}' \
              --max-time 30 --retry 3 --retry-connrefused \
              -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
              -H "Accept: application/json" \
              "${COOLIFY_URL}/api/v1/deployments/applications/${APPLICATION_UUID}" || echo '000')
            if [ "$code" = "401" ] || [ "$code" = "403" ]; then
              echo "::error::Coolify API returned HTTP ${code} while listing deployments. Refresh COOLIFY_API_TOKEN and make sure it can read deployments."
              head -c 400 "$out_file"; echo
              return 2
            fi
            if [ "$code" = "404" ]; then
              echo "::error::Coolify API returned HTTP 404 while listing deployments. Check COOLIFY_INGEST_UUID."
              return 2
            fi
            if [ "$code" != "200" ]; then
              echo "Coolify API returned HTTP ${code}; retrying"
              return 1
            fi
            if ! jq -e "${DEPLOYMENTS_JQ} | type == \"array\"" < "$out_file" >/dev/null 2>&1; then
              echo "Coolify API returned an unsupported deployment list response; retrying"
              head -c 400 "$out_file"; echo
              return 1
            fi
            return 0
          }

          POLL_BODY="$(mktemp)"
          DEADLINE=$(( $(date +%s) + 900 ))
          echo "Tracking ${ENV_NAME} deployment id=${DEPLOYMENT_ID}"

          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            fetch_deploys "$POLL_BODY"
            FETCH_RESULT=$?
            if [ "$FETCH_RESULT" -eq 2 ]; then
              rm -f "$POLL_BODY"
              exit 1
            fi
            if [ "$FETCH_RESULT" -ne 0 ]; then
              echo "Coolify API transient failure; retrying"
              sleep 15
              continue
            fi

            # Wait for the specific deployment returned by the deploy
            # API. Prefer `deployment_uuid` because records can also
            # carry a numeric internal `id`.
            STATUS=$(jq -r --arg id "$DEPLOYMENT_ID" "${DEPLOYMENTS_JQ} |
              [ .[]? | select(((.deployment_uuid // .uuid // .id) | tostring) == \$id) ][0].status // \"unknown\"
            " < "$POLL_BODY" 2>/dev/null || echo "unknown")

            case "$STATUS" in
              finished|success)
                echo "Coolify deployment ${DEPLOYMENT_ID} reached status=${STATUS}"
                rm -f "$POLL_BODY"
                exit 0
                ;;
              failed|cancelled|error)
                echo "::error::Coolify deployment ${DEPLOYMENT_ID} ended with status=${STATUS}"
                rm -f "$POLL_BODY"
                exit 1
                ;;
              *)
                echo "Coolify deployment ${DEPLOYMENT_ID}: status=${STATUS}; waiting..."
                sleep 15
                ;;
            esac
          done
          rm -f "$POLL_BODY"
          echo "::error::Timed out waiting for Coolify deployment ${DEPLOYMENT_ID} to finish"
          exit 1

      - name: Healthcheck (sanity)
        id: healthcheck
        env:
          BASE_URL: ${{ steps.resolve.outputs.base_url }}
        run: |
          set -euo pipefail
          # Coolify reported the deploy as finished. A 200 here is a
          # belt-and-braces check that traffic actually reaches the new
          # container — failing this with a recently-finished Coolify
          # deploy means routing or DNS is in a bad state.
          for attempt in 1 2 3 4 5; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' \
              "${BASE_URL}/healthz" || echo '000')
            if [ "$CODE" = "200" ]; then
              echo "Healthcheck passed (200)"
              exit 0
            fi
            echo "Healthcheck attempt ${attempt}: HTTP ${CODE}"
            sleep 5
          done
          echo "::error::Healthcheck failed after Coolify reported deploy finished"
          exit 1

      - name: Notify Sentry of release
        # Tells Sentry a new release went out so it can:
        #   - track regressions ("issue resolved in 1.0.0, reappeared in 1.0.1")
        #   - suggest suspect commits on new errors (via --auto)
        #   - render the deploy in the release timeline per environment
        # Non-blocking by design: a Sentry hiccup must not fail a green deploy,
        # and the step self-skips while the token (or the Sentry project) does
        # not exist yet. SENTRY_RELEASE must match what the SDK reports via
        # TARMOTO_SENTRY_RELEASE at runtime — the stamp step above sets exactly
        # this value — otherwise Sentry creates an orphan release that never
        # sees events.
        if: success()
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: studio81-labs
          SENTRY_PROJECT: tarmoto-ingest
          SENTRY_RELEASE: ${{ steps.version.outputs.app_version }}
          ENV_NAME: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          if [ -z "${SENTRY_AUTH_TOKEN}" ]; then
            echo "::warning::SENTRY_AUTH_TOKEN not set — skipping Sentry release notification"
            exit 0
          fi
          npx --yes @sentry/cli@3.6.2 releases new "$SENTRY_RELEASE"
          npx --yes @sentry/cli@3.6.2 releases set-commits "$SENTRY_RELEASE" --auto
          npx --yes @sentry/cli@3.6.2 releases finalize "$SENTRY_RELEASE"
          npx --yes @sentry/cli@3.6.2 releases deploys "$SENTRY_RELEASE" new -e "$ENV_NAME"
          echo "::notice::Sentry release ${SENTRY_RELEASE} marked deployed to ${ENV_NAME}"

      - name: Surface manual rollback instructions on failure
        # Coolify v4's API does not expose a "redeploy this previous
        # deployment" endpoint we can call from CI. Rather than ship a
        # broken automated rollback, we list the recent deploys for
        # forensic context and direct the operator to the Coolify UI's
        # Redeploy button on the last green build.
        if: failure()
        env:
          ENV_NAME: ${{ steps.env.outputs.name }}
          BASE_URL: ${{ steps.resolve.outputs.base_url }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          APPLICATION_UUID: ${{ steps.resolve.outputs.app_uuid }}
          COOLIFY_URL: ${{ vars.COOLIFY_API_BASE_URL }}
          # The actual offending step. Each verification step has its own
          # id; whichever ran most recently and reported failure is the
          # one to name in the operator-facing error message.
          WAIT_OUTCOME: ${{ steps.wait_deploy.outcome }}
          HEALTHCHECK_OUTCOME: ${{ steps.healthcheck.outcome }}
        run: |
          set +e

          # Pick the actual failing step rather than always blaming the
          # deploy trigger. Order matches execution order — the first
          # failure short-circuits the rest, so the earliest `failure` wins.
          if [ "$WAIT_OUTCOME" = "failure" ]; then
            FAILED_STEP="Coolify deployment never reached status=finished"
          elif [ "$HEALTHCHECK_OUTCOME" = "failure" ]; then
            FAILED_STEP="post-deploy healthcheck against ${BASE_URL}"
          else
            # Deploy trigger or env-validation step failed before either
            # id'd step reported. The job's error log has the specific step.
            FAILED_STEP="deploy setup (Coolify API trigger or missing secret/var)"
          fi

          if [ -n "$COOLIFY_API_TOKEN" ] && [ -n "$COOLIFY_URL" ] && [ -n "$APPLICATION_UUID" ]; then
            BODY="$(mktemp)"
            HTTP_CODE=$(curl --silent --show-error --output "$BODY" --write-out '%{http_code}' --max-time 30 \
              -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
              -H "Accept: application/json" \
              "${COOLIFY_URL}/api/v1/deployments/applications/${APPLICATION_UUID}" || echo '000')

            echo "::group::Recent ${ENV_NAME} deployments (most recent first)"
            if [ "$HTTP_CODE" = "200" ]; then
              jq -r '
                (if type == "array" then . elif type == "object" and (.deployments | type == "array") then .deployments else [] end)[]
                | "\(.deployment_uuid // .uuid // .id // "?")\t\(.status // "?")\t\(.commit // .commit_sha // .git_commit_sha // "?")\t\(.created_at // "?")"
              ' < "$BODY" 2>/dev/null \
                | head -10
            else
              echo "Could not list recent deployments: Coolify API returned HTTP ${HTTP_CODE}"
              head -c 400 "$BODY"; echo
            fi
            rm -f "$BODY"
            echo "::endgroup::"
          fi

          echo "::error::${ENV_NAME} deploy verification failed at: ${FAILED_STEP}"
          echo "::error::Manual rollback:"
          echo "::error::  1. Open Coolify → ${ENV_NAME} application → Deployments"
          echo "::error::  2. Find the most recent deployment with status=finished and a healthy commit"
          echo "::error::  3. Click Redeploy"
