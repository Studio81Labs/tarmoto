name: Mobile Release

# Manual-dispatch only. We don't auto-release on merge to main —
# Apple/Play review windows make that a footgun. The workflow reads
# the release version from a `mobile-vX.Y.Z` git tag and the build
# number from the GitHub run number.

on:
  push:
    tags: ["mobile-v*"]
  workflow_dispatch:
    inputs:
      platforms:
        description: "Which platforms to release"
        required: true
        type: choice
        default: both
        options: [both, ios, android]
      version:
        description: "Version (e.g. 1.2.3) — must match the git tag if pushing one"
        required: true
        type: string
      release_notes:
        description: "Release notes for TestFlight / Play Internal"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mobile-release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      release_notes: ${{ steps.resolve.outputs.release_notes }}
      run_ios: ${{ steps.resolve.outputs.run_ios }}
      run_android: ${{ steps.resolve.outputs.run_android }}
    steps:
      - name: Resolve version + platforms
        id: resolve
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
          DISPATCH_PLATFORMS: ${{ github.event.inputs.platforms }}
          DISPATCH_NOTES: ${{ github.event.inputs.release_notes }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            VERSION="${REF_NAME#mobile-v}"
            PLATFORMS="both"
            # Tag-driven release: synthesise a non-empty changelog so
            # TestFlight / Play Internal don't show a blank "what's
            # new". Dispatch invocations supply their own notes.
            NOTES="Release ${REF_NAME}"
          else
            VERSION="$DISPATCH_VERSION"
            PLATFORMS="$DISPATCH_PLATFORMS"
            NOTES="$DISPATCH_NOTES"
          fi
          # Reject anything that isn't a strict semver — the tag /
          # input value flows directly into Info.plist and
          # build.gradle, so be ruthless about it.
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$VERSION' is not a strict X.Y.Z semver"
            exit 1
          fi
          {
            echo "version=${VERSION}"
            # Multiline output via heredoc so dispatch-supplied notes
            # with embedded newlines round-trip cleanly.
            echo "release_notes<<RELEASE_NOTES_EOF"
            printf '%s\n' "$NOTES"
            echo "RELEASE_NOTES_EOF"
            if [ "$PLATFORMS" = "both" ] || [ "$PLATFORMS" = "ios" ]; then
              echo "run_ios=true"
            else
              echo "run_ios=false"
            fi
            if [ "$PLATFORMS" = "both" ] || [ "$PLATFORMS" = "android" ]; then
              echo "run_android=true"
            else
              echo "run_android=false"
            fi
          } >> "$GITHUB_OUTPUT"

  ios:
    name: iOS — TestFlight
    needs: prepare
    if: needs.prepare.outputs.run_ios == 'true'
    runs-on: macos-15
    environment: mobile-release
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.9"
          bundler-cache: true
          working-directory: apps/mobile

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm build:shared

      - name: Run beta_ios lane
        working-directory: apps/mobile
        env:
          CI: "true"
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          RELEASE_NOTES: ${{ needs.prepare.outputs.release_notes }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          FASTLANE_APPLE_ID: ${{ secrets.FASTLANE_APPLE_ID }}
          FASTLANE_TEAM_ID: ${{ secrets.FASTLANE_TEAM_ID }}
          FASTLANE_ITC_TEAM_ID: ${{ secrets.FASTLANE_ITC_TEAM_ID }}
          MATCH_KEYCHAIN_NAME: tarmoto-build
          MATCH_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: bundle exec fastlane ios beta_ios

  android:
    name: Android — Play Internal
    needs: prepare
    if: needs.prepare.outputs.run_android == 'true'
    runs-on: ubuntu-latest
    environment: mobile-release
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.9"
          bundler-cache: true
          working-directory: apps/mobile

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm build:shared

      - name: Decode signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/tarmoto-release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          echo "path=${KEYSTORE_PATH}" >> "$GITHUB_OUTPUT"

      - name: Run beta_android lane
        working-directory: apps/mobile
        env:
          CI: "true"
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          RELEASE_NOTES: ${{ needs.prepare.outputs.release_notes }}
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
        run: bundle exec fastlane android beta_android
