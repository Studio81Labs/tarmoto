name: Mobile Release

# Unified release tag: a single `vX.Y.Z` tag ships every surface —
# backend, companion, and marketing deploy from it, and this workflow
# builds + submits the mobile app to TestFlight / Play Internal so the
# store build always matches the web release at that version. Also
# runnable via workflow_dispatch. We don't auto-release on merge to main —
# Apple/Play review windows make that a footgun. The release version comes
# from the `vX.Y.Z` git tag (or the dispatch input); the build number is
# the GitHub run number.
#
# Accepted tradeoff: a `v*` tag also rebuilds mobile (macOS runner + store
# submission). For a server-only hotfix that shouldn't touch the app, don't
# cut a `v*` tag — use workflow_dispatch on the specific deploy instead.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platforms:
        description: "Which platforms to release"
        required: true
        type: choice
        default: both
        options: [both, ios, android]
      version:
        description: "Version (e.g. 1.2.3) — must match the git tag if pushing one"
        required: true
        type: string
      release_notes:
        description: "Release notes for TestFlight / Play Internal"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mobile-release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: "release: prepare"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      release_notes: ${{ steps.resolve.outputs.release_notes }}
      run_ios: ${{ steps.resolve.outputs.run_ios }}
      run_android: ${{ steps.resolve.outputs.run_android }}
    steps:
      - name: Resolve version + platforms
        id: resolve
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
          DISPATCH_PLATFORMS: ${{ github.event.inputs.platforms }}
          DISPATCH_NOTES: ${{ github.event.inputs.release_notes }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            VERSION="${REF_NAME#v}"
            PLATFORMS="both"
            # Tag-driven release: synthesise a non-empty changelog so
            # TestFlight / Play Internal don't show a blank "what's
            # new". Dispatch invocations supply their own notes.
            NOTES="Release ${REF_NAME}"
          else
            VERSION="$DISPATCH_VERSION"
            PLATFORMS="$DISPATCH_PLATFORMS"
            NOTES="$DISPATCH_NOTES"
          fi
          # Reject anything that isn't a strict semver — the tag /
          # input value flows directly into Info.plist and
          # build.gradle, so be ruthless about it.
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$VERSION' is not a strict X.Y.Z semver"
            exit 1
          fi
          {
            echo "version=${VERSION}"
            # Multiline output via heredoc so dispatch-supplied notes
            # with embedded newlines round-trip cleanly.
            echo "release_notes<<RELEASE_NOTES_EOF"
            printf '%s\n' "$NOTES"
            echo "RELEASE_NOTES_EOF"
            if [ "$PLATFORMS" = "both" ] || [ "$PLATFORMS" = "ios" ]; then
              echo "run_ios=true"
            else
              echo "run_ios=false"
            fi
            if [ "$PLATFORMS" = "both" ] || [ "$PLATFORMS" = "android" ]; then
              echo "run_android=true"
            else
              echo "run_android=false"
            fi
          } >> "$GITHUB_OUTPUT"

  quality:
    name: "mobile: quality gate"
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared package
        run: pnpm shared:build
      - name: Lint
        run: pnpm --filter @tarmoto/mobile lint
      - name: Typecheck
        run: pnpm --filter @tarmoto/mobile typecheck
      - name: Test
        run: pnpm --filter @tarmoto/mobile test

  ios:
    name: "release: ios (testflight)"
    needs: [prepare, quality]
    if: needs.prepare.outputs.run_ios == 'true'
    # React Native Firebase 25's Apple SDK requires Xcode 26.2 or newer.
    runs-on: macos-26
    environment: mobile-release
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3.6"
          bundler-cache: true
          working-directory: apps/mobile

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.4.app

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm shared:build

      - name: Validate release secrets
        working-directory: apps/mobile
        env:
          TARMOTO_FIREBASE_IOS_CONFIG_BASE64: ${{ secrets.TARMOTO_FIREBASE_IOS_CONFIG_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          FASTLANE_APPLE_ID: ${{ secrets.FASTLANE_APPLE_ID }}
          FASTLANE_TEAM_ID: ${{ secrets.FASTLANE_TEAM_ID }}
          FASTLANE_ITC_TEAM_ID: ${{ secrets.FASTLANE_ITC_TEAM_ID }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: ../../scripts/mobile/check-release-env.sh ios

      - name: Prepare Firebase config
        working-directory: apps/mobile
        env:
          TARMOTO_FIREBASE_IOS_CONFIG_BASE64: ${{ secrets.TARMOTO_FIREBASE_IOS_CONFIG_BASE64 }}
        run: ../../scripts/mobile/prepare-firebase-config.sh ios required

      - name: Run beta_ios lane
        working-directory: apps/mobile
        env:
          CI: "true"
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          RELEASE_NOTES: ${{ needs.prepare.outputs.release_notes }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          FASTLANE_APPLE_ID: ${{ secrets.FASTLANE_APPLE_ID }}
          FASTLANE_TEAM_ID: ${{ secrets.FASTLANE_TEAM_ID }}
          FASTLANE_ITC_TEAM_ID: ${{ secrets.FASTLANE_ITC_TEAM_ID }}
          MATCH_KEYCHAIN_NAME: tarmoto-build
          MATCH_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: bundle exec fastlane ios beta_ios

  android:
    name: "release: android (play internal)"
    needs: [prepare, quality]
    if: needs.prepare.outputs.run_android == 'true'
    runs-on: ubuntu-latest
    environment: mobile-release
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3.6"
          bundler-cache: true
          working-directory: apps/mobile

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm shared:build

      - name: Validate release secrets
        working-directory: apps/mobile
        env:
          TARMOTO_FIREBASE_ANDROID_CONFIG_BASE64: ${{ secrets.TARMOTO_FIREBASE_ANDROID_CONFIG_BASE64 }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
        run: ../../scripts/mobile/check-release-env.sh android

      - name: Prepare Firebase config
        working-directory: apps/mobile
        env:
          TARMOTO_FIREBASE_ANDROID_CONFIG_BASE64: ${{ secrets.TARMOTO_FIREBASE_ANDROID_CONFIG_BASE64 }}
        run: ../../scripts/mobile/prepare-firebase-config.sh android required

      - name: Decode signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/tarmoto-release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          echo "path=${KEYSTORE_PATH}" >> "$GITHUB_OUTPUT"

      - name: Run beta_android lane
        working-directory: apps/mobile
        env:
          CI: "true"
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          RELEASE_NOTES: ${{ needs.prepare.outputs.release_notes }}
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
        run: bundle exec fastlane android beta_android
