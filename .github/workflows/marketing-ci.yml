name: Marketing CI

on:
  push:
    branches: [main]
    paths:
      - "apps/marketing/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "pnpm-workspace.yaml"
      - ".github/workflows/marketing-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/marketing/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "pnpm-workspace.yaml"
      - ".github/workflows/marketing-ci.yml"

permissions:
  contents: read

concurrency:
  # PRs group by PR number so a new push supersedes the run before it. Pushes
  # group by commit SHA so every commit on main gets its own group and is
  # validated on its own.
  #
  # The SHA matters. With `github.ref` there is one group for the whole branch,
  # so merges cancel each other and commits landing in quick succession are
  # never validated. That happened to nexcue on 2026-08-06: the merge commit
  # for their #676 finished with zero check-runs while a later commit had
  # fifteen.
  #
  # `cancel-in-progress: false` does *not* fix that on its own. GitHub keeps
  # only one pending run per group — a newly queued run cancels the previously
  # pending one whatever this flag says — so with three merges in flight the
  # middle commit is still dropped. Only a per-commit group covers every one.
  #
  # Worth knowing when reading history: a cancelled run reports as *failed*, so
  # the symptom looks like a broken branch rather than an unverified one.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: "marketing: lint, typecheck, test & build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build before standalone typecheck: `next build` is what
      # generates `apps/marketing/next-env.d.ts` (gitignored ambient
      # declarations for next/font, next/image, etc.). On a fresh CI
      # checkout that file doesn't exist, so running `tsc --noEmit`
      # first would fail on missing Next ambient types.
      - name: Build marketing site
        run: pnpm marketing:build

      - name: Lint marketing site
        run: pnpm marketing:lint

      - name: Typecheck marketing site
        run: pnpm marketing:typecheck

      - name: Test marketing site
        # Runs both worker.test.mjs and social-metadata.test.mjs from
        # apps/marketing via `node --test *.test.mjs`. Nexcue ships
        # these tests but doesn't wire them into CI — we do.
        run: pnpm --filter @tarmoto/web test

      - name: Validate Cloudflare Worker bundle
        # `wrangler deploy --dry-run` compiles worker.mjs against
        # wrangler.jsonc and validates the assets directory exists.
        # Surfaces broken worker code or config drift before deploy.
        working-directory: apps/marketing
        run: pnpm dlx wrangler@4.123.0 deploy --dry-run --outdir "$RUNNER_TEMP/wrangler-dry-run"

      - name: Upload static export
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: marketing-out
          path: apps/marketing/out
          retention-days: 7
