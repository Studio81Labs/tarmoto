name: Marketing CI

on:
  push:
    branches: [main]
    paths:
      - "apps/marketing/**"
      - "packages/brand/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/marketing-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/marketing/**"
      - "packages/brand/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/marketing-ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build brand
        run: pnpm brand:build

      - name: Build marketing site
        run: pnpm marketing:build

      - name: Typecheck marketing site
        run: pnpm marketing:typecheck

      - name: Typecheck worker
        run: pnpm --filter @tarmoto/worker typecheck

      - name: Test worker
        run: pnpm --filter @tarmoto/worker test

      - name: Validate Cloudflare Worker bundle
        # `wrangler deploy --dry-run` compiles src/index.ts against
        # wrangler.jsonc and surfaces broken worker code or config
        # drift before deploy.
        working-directory: apps/marketing/worker
        run: pnpm dlx wrangler@latest deploy --dry-run --outdir "$RUNNER_TEMP/wrangler-dry-run"
