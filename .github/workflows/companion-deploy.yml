name: Companion Deploy

# PR previews, staging, and production deploys for the companion (Next.js).
# Hosted on Cloudflare Workers via @opennextjs/cloudflare.
#
# Deploy model:
#   PR to main      → preview   (wrangler versions upload, pr-N alias)
#   push to main    → staging   (wrangler deploy to staging worker)
#   push tag v*     → production (wrangler deploy to production worker)
#
# Required repo secrets:
#   CLOUDFLARE_API_TOKEN          Workers Scripts:Edit, Subdomain:Read, Account:Read
#
# Required repo variables:
#   CLOUDFLARE_ACCOUNT_ID              Account hosting the Worker
#   COMPANION_WORKERS_SUBDOMAIN (var)  workers.dev subdomain (e.g. studio81)
#   COMPANION_PROD_WORKER_NAME (var)    Production worker name (default: tarmoto-companion)
#   COMPANION_STAGING_WORKER_NAME (var) Staging worker name (default: tarmoto-companion-staging)
#   COMPANION_DEPLOY_ENABLED (var)     Kill switch: must be "true" to run
#   NEXT_PUBLIC_API_URL (var)          Production backend URL for companion build
#   NEXT_PUBLIC_WS_URL (var)           Production WebSocket URL for companion build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "apps/companion/**"
      - "apps/backend/**"
      - "packages/shared/**"
      - "packages/openapi/**"
      - ".github/workflows/companion-deploy.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/companion/**"
      - "apps/backend/**"
      - "packages/shared/**"
      - "packages/openapi/**"
      - ".github/workflows/companion-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  pull-requests: write

concurrency:
  group: companion-deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy to Cloudflare Workers
    # Dependabot-authored PRs don't receive environment secrets
    # (CLOUDFLARE_API_TOKEN), so skip the deploy. Build & Test still gates the
    # bump; deploy re-runs on push to main after merge.
    if: vars.COMPANION_DEPLOY_ENABLED == 'true' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'pull_request' && 'companion-preview' || 'companion-production' }}
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm shared:build

      - name: Generate OpenAPI client
        run: pnpm openapi:gen

      - name: Resolve environment
        id: env
        env:
          IS_PR: ${{ github.event_name == 'pull_request' }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          if [ "$IS_PR" = "true" ]; then
            ENV_NAME="preview"
          elif [ "$IS_TAG" = "true" ]; then
            ENV_NAME="production"
          else
            ENV_NAME="staging"
          fi
          echo "name=${ENV_NAME}" >> "$GITHUB_OUTPUT"

          if [ "$ENV_NAME" = "production" ]; then
            echo "api_url=${{ vars.NEXT_PUBLIC_API_URL || 'https://api.tarmoto.app' }}" >> "$GITHUB_OUTPUT"
            echo "ws_url=${{ vars.NEXT_PUBLIC_WS_URL || 'wss://api.tarmoto.app' }}" >> "$GITHUB_OUTPUT"
          else
            echo "api_url=https://api-staging.tarmoto.app" >> "$GITHUB_OUTPUT"
            echo "ws_url=wss://api-staging.tarmoto.app" >> "$GITHUB_OUTPUT"
          fi

      - name: Build companion (OpenNext for Cloudflare)
        env:
          NEXT_PUBLIC_API_URL: ${{ steps.env.outputs.api_url }}
          NEXT_PUBLIC_WS_URL: ${{ steps.env.outputs.ws_url }}
        run: pnpm --filter @tarmoto/companion run cf:build

      - name: Resolve worker name
        id: worker
        env:
          PROD_NAME: ${{ vars.COMPANION_PROD_WORKER_NAME || 'tarmoto-companion' }}
          STAGING_NAME: ${{ vars.COMPANION_STAGING_WORKER_NAME || 'tarmoto-companion-staging' }}
          IS_PR: ${{ github.event_name == 'pull_request' }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          if [ "$IS_PR" = "true" ]; then
            echo "name=${PROD_NAME}" >> "$GITHUB_OUTPUT"
          elif [ "$IS_TAG" = "true" ]; then
            echo "name=${PROD_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${STAGING_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy
        id: deploy
        working-directory: apps/companion
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: ${{ steps.worker.outputs.name }}
          WORKERS_SUBDOMAIN: ${{ vars.COMPANION_WORKERS_SUBDOMAIN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          IS_PR: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          if [ -z "${WORKERS_SUBDOMAIN}" ]; then
            echo "::error::COMPANION_WORKERS_SUBDOMAIN repo var is required"
            exit 1
          fi
          SHORT_SHA="${GITHUB_SHA::7}"
          if [ "$IS_PR" = "true" ]; then
            ALIAS="pr-${PR_NUMBER}"
            pnpm exec wrangler versions upload \
              --name "$WORKER_NAME" \
              --preview-alias "$ALIAS" \
              --message "PR #${PR_NUMBER} (${SHORT_SHA})"
            URL="https://${ALIAS}-${WORKER_NAME}.${WORKERS_SUBDOMAIN}.workers.dev"
          else
            pnpm exec wrangler deploy \
              --x-autoconfig=false \
              --name "$WORKER_NAME" \
              --message "main @ ${SHORT_SHA}"
            URL="https://${WORKER_NAME}.${WORKERS_SUBDOMAIN}.workers.dev"
          fi
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        if: steps.deploy.outputs.url != ''
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            STATUS=$(curl -sL -o response.html -w "%{http_code}" "$URL" || true)
            if [ "$STATUS" = "200" ] && grep -qi "tarmoto" response.html; then
              echo "::notice::Companion smoke OK ($URL)"
              exit 0
            fi
            echo "Smoke attempt $attempt: HTTP $STATUS"
            sleep 5
          done
          echo "::error::Companion smoke failed after 3 attempts (last status $STATUS)"
          exit 1

      - name: Comment PR with preview URL
        if: github.event_name == 'pull_request' && steps.deploy.outputs.url != ''
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const url = process.env.PREVIEW_URL;
            const body = `Companion preview deployed: ${url}`;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.user.type === 'Bot' && c.body.startsWith('Companion preview deployed'));
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              });
            }
