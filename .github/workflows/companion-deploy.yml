name: Companion Deploy

# PR previews and prod deploys for the companion (Next.js).
# Hosted on Cloudflare Workers (Workers + Static Assets) via the
# upstream-supported `@opennextjs/cloudflare` adapter. The adapter
# runs `next build` directly so the pnpm workspace topology is
# preserved (the predecessor `@cloudflare/next-on-pages` did its
# own scoped pnpm install which broke Next 16's Turbopack root
# inference).
#
# Required repo secrets / vars:
#   CLOUDFLARE_API_TOKEN              — Workers Scripts:Edit,
#                                      Workers Subdomain:Read,
#                                      Account:Read.
#   CLOUDFLARE_ACCOUNT_ID             — account hosting the Worker.
#   COMPANION_WORKER_NAME (var)       — Worker script name, default
#                                      tarmoto-companion. Used as the
#                                      hostname prefix for prod and
#                                      preview URLs.
#   COMPANION_WORKERS_SUBDOMAIN (var) — the account's workers.dev
#                                      subdomain (e.g. tarmoto). Used
#                                      to construct the URL we comment
#                                      on PRs and smoke-test.
#   COMPANION_DEPLOY_ENABLED (var)    — gate / kill switch: must be
#                                      the literal string "true" for
#                                      the workflow to run end-to-end.
#                                      Flip back to "false" to halt
#                                      previews + prod deploys without
#                                      a code change (e.g. during a
#                                      Cloudflare incident or while
#                                      rotating the API token).

on:
  push:
    branches: [main]
    paths:
      - "apps/companion/**"
      - "apps/backend/**"
      - "packages/shared/**"
      - "packages/openapi/**"
      - ".github/workflows/companion-deploy.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/companion/**"
      - "apps/backend/**"
      - "packages/shared/**"
      - "packages/openapi/**"
      - ".github/workflows/companion-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  pull-requests: write

concurrency:
  group: companion-deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy to Cloudflare Workers
    # Skip until the operator opts in via the repo variable. See the
    # `COMPANION_DEPLOY_ENABLED` note in the header. Until then the
    # job no-ops and the PR check stays green.
    if: vars.COMPANION_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'pull_request' && 'companion-preview' || 'companion-production' }}
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # wrangler picks up commit metadata for the deploy

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm shared:build

      - name: Generate OpenAPI client
        run: pnpm openapi:gen

      - name: Build companion (OpenNext for Cloudflare)
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://api.tarmoto.app' }}
          NEXT_PUBLIC_WS_URL: ${{ vars.NEXT_PUBLIC_WS_URL || 'wss://api.tarmoto.app' }}
        # `cf:build` runs `next build` then applies the OpenNext
        # transform that emits .open-next/worker.js + .open-next/assets,
        # which `wrangler deploy` / `wrangler versions upload` consume.
        run: pnpm --filter @tarmoto/companion run cf:build

      - name: Resolve worker name
        id: worker
        env:
          NAME_VAR: ${{ vars.COMPANION_WORKER_NAME }}
        run: |
          NAME="${NAME_VAR:-tarmoto-companion}"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: Deploy
        id: deploy
        working-directory: apps/companion
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: ${{ steps.worker.outputs.name }}
          WORKERS_SUBDOMAIN: ${{ vars.COMPANION_WORKERS_SUBDOMAIN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          IS_PR: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          if [ -z "${WORKERS_SUBDOMAIN}" ]; then
            echo "::error::COMPANION_WORKERS_SUBDOMAIN repo var is required to construct preview/prod URLs"
            exit 1
          fi
          SHORT_SHA="${GITHUB_SHA::7}"
          if [ "$IS_PR" = "true" ]; then
            ALIAS="pr-${PR_NUMBER}"
            # `versions upload` produces a static, aliased preview URL
            # without rolling traffic to it — same model as the old
            # pages.dev branch preview, on Workers.
            pnpm exec wrangler versions upload \
              --name "$WORKER_NAME" \
              --preview-alias "$ALIAS" \
              --message "PR #${PR_NUMBER} (${SHORT_SHA})"
            URL="https://${ALIAS}-${WORKER_NAME}.${WORKERS_SUBDOMAIN}.workers.dev"
          else
            # Disable wrangler 4's --experimental-autoconfig (default
            # on in 4.x): when wrangler detects a Next.js project it
            # delegates `wrangler deploy` to `opennextjs-cloudflare`,
            # whose CLI wrapper re-quotes our `--message` arg and
            # breaks on the space (yargs then fails with "Unknown
            # argument: <short_sha>"). We've already built explicitly
            # via `cf:build` and wrangler.jsonc points at
            # `.open-next/worker.js` + `.open-next/assets`, so there's
            # nothing for autoconfig to orchestrate — bypass it for
            # deterministic arg handling. Only `wrangler deploy`
            # honors this flag; `versions upload` doesn't go through
            # autoconfig and rejects the flag as unknown.
            pnpm exec wrangler deploy \
              --x-autoconfig=false \
              --name "$WORKER_NAME" \
              --message "main @ ${SHORT_SHA}"
            URL="https://${WORKER_NAME}.${WORKERS_SUBDOMAIN}.workers.dev"
          fi
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        if: steps.deploy.outputs.url != ''
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          # Follow redirects: an unauthenticated GET /  302s to /login
          # via NextAuth middleware, which is the expected steady state
          # for the gated companion. We care that the final response is
          # 200 and contains the app shell marker, not that the root
          # path served 200 directly.
          for attempt in 1 2 3; do
            STATUS=$(curl -sL -o response.html -w "%{http_code}" "$URL" || true)
            if [ "$STATUS" = "200" ] && grep -qi "tarmoto" response.html; then
              echo "::notice::Companion smoke OK ($URL)"
              exit 0
            fi
            echo "Smoke attempt $attempt: HTTP $STATUS"
            sleep 5
          done
          echo "::error::Companion smoke failed after 3 attempts (last status $STATUS)"
          exit 1

      - name: Comment PR with preview URL
        if: github.event_name == 'pull_request' && steps.deploy.outputs.url != ''
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const url = process.env.PREVIEW_URL;
            const body = `Companion preview deployed: ${url}`;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.user.type === 'Bot' && c.body.startsWith('Companion preview deployed'));
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              });
            }
