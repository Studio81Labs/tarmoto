name: Companion Deploy

# Staging + production deploys for the companion (Next.js). Hosted on
# Cloudflare Workers via @opennextjs/cloudflare. PR previews were dropped —
# review companion changes locally; they ship to staging on merge to main.
#
# Deploy model:
#   push to main    → staging   (wrangler deploy to staging worker)
#   push tag v*     → production (wrangler deploy to production worker)
#   workflow_dispatch → staging
#
# Required repo secrets:
#   CLOUDFLARE_API_TOKEN          Workers Scripts:Edit, Subdomain:Read, Account:Read
#
# Required repo variables:
#   CLOUDFLARE_ACCOUNT_ID              Account hosting the Worker
#   COMPANION_WORKERS_SUBDOMAIN (var)  workers.dev subdomain (e.g. studio81)
#   NEXT_PUBLIC_API_URL (var)          Production backend URL for companion build
#   NEXT_PUBLIC_WS_URL (var)           Production WebSocket URL for companion build
#
# Required per-environment variables (staging / production):
#   COMPANION_WORKER_NAME (var)        worker name for that environment
#                                      (production: tarmoto-companion;
#                                      staging: tarmoto-companion-staging)

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "apps/companion/**"
      - "apps/backend/**"
      - "packages/shared/**"
      - "packages/openapi/**"
      - ".github/workflows/companion-deploy.yml"
      - ".github/workflows/_build-openapi.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: companion-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build the OpenAPI spec once (reusable workflow) and fan it out as an
  # artifact, instead of rebuilding the backend inline in the deploy job.
  prepare-openapi:
    uses: ./.github/workflows/_build-openapi.yml
    with:
      # The deploy job is environment-gated (staging / production) and may sit
      # behind a required-reviewer approval; keep the spec artifact well past
      # the 1-day default so a multi-day hold doesn't expire it before the
      # deploy downloads it.
      artifact-retention-days: 7

  deploy:
    name: Build & deploy to Cloudflare Workers
    needs: prepare-openapi
    runs-on: ubuntu-latest
    # push to main → staging, tag v* → production. Each environment scopes
    # COMPANION_WORKER_NAME.
    environment:
      name: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm shared:build

      - name: Download generated OpenAPI spec
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: openapi-spec
          path: ${{ runner.temp }}

      - name: Restore generated OpenAPI spec
        run: |
          mkdir -p packages/openapi
          tar -xzf "$RUNNER_TEMP/openapi-spec.tgz" -C packages/openapi

      - name: Generate OpenAPI client
        run: pnpm --filter @tarmoto/openapi-client generate

      - name: Resolve environment
        id: env
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          if [ "$IS_TAG" = "true" ]; then
            ENV_NAME="production"
          else
            ENV_NAME="staging"
          fi
          echo "name=${ENV_NAME}" >> "$GITHUB_OUTPUT"

          if [ "$ENV_NAME" = "production" ]; then
            echo "api_url=${{ vars.NEXT_PUBLIC_API_URL || 'https://api.tarmoto.app' }}" >> "$GITHUB_OUTPUT"
            echo "ws_url=${{ vars.NEXT_PUBLIC_WS_URL || 'wss://api.tarmoto.app' }}" >> "$GITHUB_OUTPUT"
          else
            echo "api_url=https://api-staging.tarmoto.app" >> "$GITHUB_OUTPUT"
            echo "ws_url=wss://api-staging.tarmoto.app" >> "$GITHUB_OUTPUT"
          fi

      - name: Build companion (OpenNext for Cloudflare)
        env:
          NEXT_PUBLIC_API_URL: ${{ steps.env.outputs.api_url }}
          NEXT_PUBLIC_WS_URL: ${{ steps.env.outputs.ws_url }}
        run: pnpm --filter @tarmoto/companion run cf:build

      - name: Resolve worker name
        id: worker
        # COMPANION_WORKER_NAME is env-scoped (resolved per the job's
        # environment), so read it directly.
        env:
          ENV_NAME: ${{ steps.env.outputs.name }}
          WORKER_NAME: ${{ vars.COMPANION_WORKER_NAME }}
        run: |
          test -n "$WORKER_NAME" || {
            echo "::error::COMPANION_WORKER_NAME var is not set in env ${ENV_NAME}"
            exit 1
          }
          echo "name=${WORKER_NAME}" >> "$GITHUB_OUTPUT"

      - name: Deploy
        id: deploy
        working-directory: apps/companion
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: ${{ steps.worker.outputs.name }}
          WORKERS_SUBDOMAIN: ${{ vars.COMPANION_WORKERS_SUBDOMAIN }}
        run: |
          set -euo pipefail
          if [ -z "${WORKERS_SUBDOMAIN}" ]; then
            echo "::error::COMPANION_WORKERS_SUBDOMAIN repo var is required"
            exit 1
          fi
          SHORT_SHA="${GITHUB_SHA::7}"
          pnpm exec wrangler deploy \
            --x-autoconfig=false \
            --name "$WORKER_NAME" \
            --message "main @ ${SHORT_SHA}"
          URL="https://${WORKER_NAME}.${WORKERS_SUBDOMAIN}.workers.dev"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        if: steps.deploy.outputs.url != ''
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            STATUS=$(curl -sL -o response.html -w "%{http_code}" "$URL" || true)
            if [ "$STATUS" = "200" ] && grep -qi "tarmoto" response.html; then
              echo "::notice::Companion smoke OK ($URL)"
              exit 0
            fi
            echo "Smoke attempt $attempt: HTTP $STATUS"
            sleep 5
          done
          echo "::error::Companion smoke failed after 3 attempts (last status $STATUS)"
          exit 1
