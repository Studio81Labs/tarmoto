name: PoC CI

# Pull-request validation for apps/poc-sensor. Main-branch builds are
# handled by poc-deploy.yml, which also ships to Cloudflare Pages.
on:
  pull_request:
    branches: [main]
    paths:
      - "apps/poc-sensor/**"
      - ".github/workflows/poc-ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build PoC sensor
        run: pnpm build:poc
