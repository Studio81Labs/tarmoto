name: Admin CI

on:
  push:
    branches: [main]
    paths:
      - "apps/admin/**"
      - "apps/backend/**"
      - "packages/**"
      - ".github/workflows/admin-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/admin/**"
      - "apps/backend/**"
      - "packages/**"
      - ".github/workflows/admin-ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm shared:build

      - name: Generate OpenAPI client
        # Admin imports from @tarmoto/openapi, whose types.ts is
        # generated from the backend's swagger spec (both types.ts and
        # openapi.yaml are gitignored). Without this step the admin
        # typecheck fails with "Cannot find module './types.js'".
        run: pnpm openapi:gen

      - name: Lint
        run: pnpm --filter @tarmoto/admin lint

      - name: Typecheck
        run: pnpm --filter @tarmoto/admin typecheck

      - name: Test
        run: pnpm --filter @tarmoto/admin test

      - name: Build
        run: pnpm --filter @tarmoto/admin build
