name: Admin CI

on:
  push:
    branches: [main]
    paths:
      - "apps/admin/**"
      - "apps/backend/**"
      - "packages/**"
      - ".github/workflows/admin-ci.yml"
      - ".github/workflows/_build-openapi.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/admin/**"
      - "apps/backend/**"
      - "packages/**"
      - ".github/workflows/admin-ci.yml"
      - ".github/workflows/_build-openapi.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Build the OpenAPI spec once (reusable workflow) and fan it out as an
  # artifact, instead of rebuilding the backend inline here.
  prepare-openapi:
    uses: ./.github/workflows/_build-openapi.yml

  build:
    name: Build & Test
    needs: prepare-openapi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm shared:build

      - name: Download generated OpenAPI spec
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: openapi-spec
          path: ${{ runner.temp }}

      - name: Restore generated OpenAPI spec
        run: |
          mkdir -p packages/openapi
          tar -xzf "$RUNNER_TEMP/openapi-spec.tgz" -C packages/openapi

      # Admin imports @tarmoto/openapi-client, whose generated schema.d.ts is
      # produced from the spec above (both are gitignored). Without it the
      # admin typecheck fails to resolve the generated module.
      - name: Generate OpenAPI client
        run: pnpm --filter @tarmoto/openapi-client generate

      - name: Lint
        run: pnpm --filter @tarmoto/admin lint

      - name: Typecheck
        run: pnpm --filter @tarmoto/admin typecheck

      - name: Test
        run: pnpm --filter @tarmoto/admin test

      - name: Build
        run: pnpm --filter @tarmoto/admin build
